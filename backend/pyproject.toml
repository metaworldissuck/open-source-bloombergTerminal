[project]
name = "openterm-backend"
version = "0.1.0"
description = "OpenTerm: Open-source multi-asset quantitative financial terminal backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "duckdb>=1.1.0",
    "polars>=1.12.0",
    "pyarrow>=18.0.0",
    "numpy>=2.1.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
adapters = [
    "yfinance>=0.2.48",
    "ccxt>=4.4.0",
    "akshare>=1.15.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
