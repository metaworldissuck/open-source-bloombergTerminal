    :root {

      --border: #243146;

    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .term-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .term-table th { position: sticky; top: 0; background: var(--sidebar); color: var(--muted-foreground); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .term-table td { padding: 5px 8px; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
    .term-table tbody tr:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); }
    .pane-active { outline: 2px solid var(--warning); outline-offset: -1px; }
    canvas { display: block; }
  </style>
</head>

  <div id="app" class="min-h-screen flex flex-col">

            <span class="hidden sm:inline mono text-xs text-[var(--muted-foreground)]">F2 EQ · F3 CR</span>
          </div>
          <div id="cmd-dropdown" class="hidden absolute left-0 right-0 mt-1 bg-[var(--card)] border border-[var(--border)] rounded shadow-xl max-h-72 overflow-y-auto z-50"></div>
        </div>

        <div class="flex flex-wrap items-center gap-1" id="quick-cmds"></div>

        <!-- Layout Switcher -->
        <div class="flex items-center gap-1 bg-[var(--background)] border border-[var(--border)] rounded p-0.5 mono text-xs" id="layout-controls"></div>
      </div>
      <div id="cmd-error" class="hidden mt-1.5 px-2.5 py-1 rounded border border-[var(--error)] text-[var(--error)] mono text-xs"></div>
    </header>

    <footer class="px-3 py-1 bg-[var(--sidebar)] border-t border-[var(--border)] flex flex-wrap items-center justify-between gap-2 text-xs mono text-[var(--muted-foreground)]">
      <div class="flex flex-wrap items-center gap-3">

      let hitUp = false, hitDn = false;

      if (inst.market === 'CN_ASHARE' && inst.limitPct) {
        const up = roundCny(prev * (1 + inst.limitPct));
        const dn = roundCny(prev * (1 - inst.limitPct));

        hitUp = close >= up - 0.005;
        hitDn = close <= dn + 0.005;
      } else {
        close = Number(close.toFixed(2));
      }
      const open = Number((prev * (1 + gauss() * inst.vol * 0.28)).toFixed(2));
      const high = Number((Math.max(open, close) * (1 + Math.abs(gauss() * inst.vol * 0.45))).toFixed(2));
      const low = Number((Math.min(open, close) * (1 - Math.abs(gauss() * inst.vol * 0.45))).toFixed(2));
      const volume = Math.round(inst.baseVol * Math.max(0.35, 1 + gauss() * 0.35 + Math.abs(ret) * 10));
      candles.push({ date: dateStr, open, high, low, close, volume, prev, hitUp, hitDn });
      if (inst.market === 'CN_ASHARE') {
        nbFlows.push({ date: dateStr, flow: (close >= prev ? 1.4e8 : -1.0e8) + gauss() * 3.5e8 });
      }
      px = close;
    }
    inst.candles = candles;
    inst.nbFlows = nbFlows.slice(-20);

  });

  // Format helpers
  function fmtCompact(v, ccy) {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    const sign = v < 0 ? '-' : '';
    const a = Math.abs(v);
    const sym = ccy === 'CNY' ? '¥' : ccy === 'USD' ? '$' : '';
    if (a >= 1e12) return `${sign}${sym}${(a / 1e12).toFixed(2)}T`;
    if (a >= 1e9) return `${sign}${sym}${(a / 1e9).toFixed(2)}B`;
    if (a >= 1e6) return `${sign}${sym}${(a / 1e6).toFixed(2)}M`;
    if (a >= 1e3) return `${sign}${sym}${(a / 1e3).toFixed(1)}K`;
    return `${sign}${sym}${a.toFixed(2)}`;
  }
  function fmtPx(v, ccy) {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    const sym = ccy === 'CNY' ? '¥' : ccy === 'USD' ? '$' : '';
    return `${sym}${Number(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  }

  function resolveTicker(raw) {
    const q = raw.trim().toUpperCase().replace(/<EQUITY>|<CRYPTO>|<FX>/g, '').trim();
    if (!q) return null;
    if (INSTRUMENTS[q]) return INSTRUMENTS[q];
    for (const inst of Object.values(INSTRUMENTS)) {
      if (inst.symbol.toUpperCase() === q) return inst;
      if (inst.aliases.some((a) => a.toUpperCase() === q)) return inst;
    }
    const first = q.split(/\s+/)[0].replace(/\.(SS|SZ|BJ)$/i, '');
    for (const inst of Object.values(INSTRUMENTS)) {
      if (inst.symbol.toUpperCase() === first || inst.symbol.startsWith(first + '-')) return inst;
    }
    return null;
  }

  function executeCommand(rawCmd, targetPaneId) {
    const errEl = document.getElementById('cmd-error');
    const cleaned = rawCmd.trim().replace(/\s+/g, ' ');
    if (!cleaned) return;
    const pane = state.panes.find((p) => p.id === (targetPaneId || state.activePaneId)) || state.panes[0];
    errEl.classList.add('hidden');

    // Multi-security COMP
    if (cleaned.includes(',')) {
      const parts = cleaned.split(',').map((s) => s.trim());
      let fn = 'COMP';
      const lastToks = parts[parts.length - 1].split(' ');
      if (FUNCTIONS.includes(lastToks[lastToks.length - 1].toUpperCase())) {
        fn = lastToks.pop().toUpperCase();
        parts[parts.length - 1] = lastToks.join(' ');
      }
      const ids = parts.map(resolveTicker).filter(Boolean).map((i) => i.id);
      if (!ids.length) {
        errEl.textContent = `CMD ERROR: Could not resolve securities in "${cleaned}"`;
        errEl.classList.remove('hidden');
        return;
      }
      pane.fn = fn;
      pane.compIds = ids;
      pane.instId = ids[0];
      renderWorkspace();
      return;
    }

    const toks = cleaned.split(' ');
    const up = toks.map((t) => t.toUpperCase());

    // Standalone function switch (uses active pane security)
    if (FUNCTIONS.includes(up[0])) {
      pane.fn = up[0];
      if (up[0] === 'NEWS' && toks[1]) {
        const inst = resolveTicker(toks[1]);
        if (inst) {
          pane.instId = inst.id;
          state.newsFilter.scopeActive = true;
        }
      }
      renderWorkspace();
      return;
    }

    // Security + optional Function
    let fn = 'DES';
    let secStr = cleaned;
    for (let i = 1; i < up.length; i++) {
      if (FUNCTIONS.includes(up[i])) {
        fn = up[i];
        secStr = toks.slice(0, i).join(' ');
        break;
      }
    }
    const resolved = resolveTicker(secStr);
    if (!resolved) {
      errEl.textContent = `CMD ERROR: Unknown ticker "${secStr}". Try AAPL US, NVDA US, 600519 CH, 300750 CH, 430047 BJ, BTC-USD, ETH-USD.`;
      errEl.classList.remove('hidden');
      return;
    }

    pane.fn = fn;
    pane.instId = resolved.id;
    // Propagate to linked panes in the same color group!
    if (pane.linkGroup !== 'NONE') {
      state.panes.forEach((p) => {
        if (p.id !== pane.id && p.linkGroup === pane.linkGroup) {
          p.instId = resolved.id;
        }
      });
    }
    renderWorkspace();
  }

  // =========================================================================
  // 3. QUANTITATIVE ANALYTICS ENGINES (DCF, Portfolio Risk, BQL Backtester)
  // =========================================================================
  function calcDcf(inst, waccPct, fcfGPct, termGPct) {
    const wacc = Math.max(termGPct / 100 + 0.01, waccPct / 100);
    const tg = termGPct / 100;
    const fg = fcfGPct / 100;
    const latest = inst.fy[inst.fy.length - 1];
    const baseFcf = Math.max(1e6, latest.ocf - latest.capex);
    const evalPx = (rw, rtg) => {
      if (rw <= rtg + 0.005) return null;
      let f = baseFcf, pvSum = 0;
      for (let yr = 1; yr <= 5; yr++) {
        const g = fg - (fg - rtg) * ((yr - 1) / 9);
        f *= (1 + g);
        pvSum += f / Math.pow(1 + rw, yr);
      }
      const tv = (f * (1 + rtg)) / (rw - rtg);
      const ev = pvSum + tv / Math.pow(1 + rw, 5);
      const eq = ev + latest.cash - latest.debt;
      return eq / inst.shares;
    };
    const fairPx = evalPx(wacc, tg) || 0;
    const spot = inst.last.close;
    const upside = ((fairPx - spot) / spot) * 100;
    const wAxis = [-1.5, -0.75, 0, 0.75, 1.5].map((d) => Number(Math.max(4, waccPct + d).toFixed(2)));
    const tAxis = [-1.0, -0.5, 0, 0.5, 1.0].map((d) => Number(Math.max(0.5, termGPct + d).toFixed(2)));
    const matrix = wAxis.map((w) => tAxis.map((t) => evalPx(w / 100, t / 100)));
    return { fairPx, spot, upside, wAxis, tAxis, matrix };
  }

  function computePortfolio(baseCcy) {
    const toBase = (ccy) => {
      if (ccy === baseCcy) return 1.0;
      if (ccy === 'CNY' && baseCcy === 'USD') return FX.CNY_USD;
      if (ccy === 'USD' && baseCcy === 'CNY') return FX.USD_CNY;
      return 1.0;
    };
    const usdToBase = baseCcy === 'CNY' ? FX.USD_CNY : 1.0;

    let totalMv = 0, totalCost = 0;
    const holdings = TRANSACTIONS.map((tx) => {
      const inst = INSTRUMENTS[tx.id];
      const fxNow = toBase(tx.ccy);
      const fxTrade = tx.fxAtTrade * usdToBase;
      const mvNative = tx.qty * inst.last.close;
      const mvBase = mvNative * fxNow;
      const costNative = tx.qty * tx.avgCost;
      const costBase = costNative * fxTrade;
      const pnlBase = mvBase - costBase;
      const assetPnl = (mvNative - costNative) * fxNow;
      const fxPnl = pnlBase - assetPnl;
      totalMv += mvBase;
      totalCost += costBase;
      return { ...tx, inst, mvBase, costBase, pnlBase, pnlPct: (pnlBase / costBase) * 100, assetPnl, fxPnl };
    });
    holdings.forEach((h) => { h.weight = (h.mvBase / totalMv) * 100; });

    // Portfolio daily returns & correlation matrix
    const retsByAsset = holdings.map((h) => {
      const cs = h.inst.candles;
      const arr = [];
      for (let i = 1; i < cs.length; i++) arr.push((cs[i].close - cs[i - 1].close) / cs[i - 1].close);
      return arr;
    });
    const T = retsByAsset[0].length;
    const portRets = [];
    for (let t = 0; t < T; t++) {
      let r = 0;
      for (let j = 0; j < holdings.length; j++) r += (holdings[j].weight / 100) * retsByAsset[j][t];
      portRets.push(r);
    }
    const mean = portRets.reduce((a, b) => a + b, 0) / T;
    const variance = portRets.reduce((a, b) => a + (b - mean) ** 2, 0) / (T - 1);
    const std = Math.sqrt(variance);
    const rfDaily = 0.042 / 252;
    const sharpe = std > 0 ? ((mean - rfDaily) / std) * Math.sqrt(252) : 0;
    const annRet = (Math.pow(1 + mean, 252) - 1) * 100;
    const annVol = std * Math.sqrt(252) * 100;

    let peak = 1, cum = 1, maxDd = 0;
    portRets.forEach((r) => {
      cum *= (1 + r);
      if (cum > peak) peak = cum;
      const dd = (cum - peak) / peak;
      if (dd < maxDd) maxDd = dd;
    });

    const sorted = [...portRets].sort((a, b) => a - b);
    const var95Pct = -sorted[Math.floor(T * 0.05)] * 100;
    const var99Pct = -sorted[Math.floor(T * 0.01)] * 100;
    const portBeta = holdings.reduce((acc, h) => acc + (h.weight / 100) * h.inst.beta, 0);

    // Correlation Matrix
    const corr = holdings.map((_, i) => holdings.map((__, j) => {
      if (i === j) return 1.0;
      const a = retsByAsset[i], b = retsByAsset[j];
      const ma = a.reduce((x, y) => x + y, 0) / T, mb = b.reduce((x, y) => x + y, 0) / T;
      let num = 0, da = 0, db = 0;
      for (let t = 0; t < T; t++) {
        const xa = a[t] - ma, xb = b[t] - mb;
        num += xa * xb; da += xa * xa; db += xb * xb;
      }
      return num / Math.sqrt(da * db || 1);
    }));

    return {
      totalMv, totalCost, unrealizedPnl: totalMv - totalCost,
      unrealizedPct: ((totalMv - totalCost) / totalCost) * 100,
      holdings, sharpe, annRet, annVol, maxDdPct: maxDd * 100, beta: portBeta,
      var95Pct, var95Val: totalMv * var95Pct / 100, var99Pct, var99Val: totalMv * var99Pct / 100,
      corr,
    };
  }

  function runBqlTemplate(templateKey) {
    const t0 = performance.now();
    if (templateKey === 'cross_asset') {
      const rows = Object.values(INSTRUMENTS).map((inst) => {
        const fx = inst.ccy === 'CNY' ? FX.CNY_USD : 1.0;
        const c = inst.candles;
        const pNow = c[c.length - 1].close * fx;
        const p30 = c[c.length - 31].close * fx;
        const ret30 = ((pNow / p30) - 1) * 100;
        const rets = [];
        for (let i = c.length - 30; i < c.length; i++) rets.push((c[i].close - c[i - 1].close) / c[i - 1].close);
        const m = rets.reduce((a, b) => a + b, 0) / rets.length;
        const sd = Math.sqrt(rets.reduce((a, b) => a + (b - m) ** 2, 0) / (rets.length - 1));
        const annVol = sd * Math.sqrt(inst.market === 'CRYPTO' ? 365 : 252) * 100;
        return {
          symbol: inst.symbol, market: inst.market, last_usd: `$${pNow.toFixed(2)}`,
          ret_30d_usd: `${ret30 >= 0 ? '+' : ''}${ret30.toFixed(2)}%`,
          ann_vol: `${annVol.toFixed(1)}%`,
          settlement: inst.settlement,
        };
      }).sort((a, b) => parseFloat(b.ret_30d_usd) - parseFloat(a.ret_30d_usd));
      return { cols: ['symbol', 'market', 'last_usd', 'ret_30d_usd', 'ann_vol', 'settlement'], rows, chart: null, ms: (performance.now() - t0).toFixed(2) };
    }
    if (templateKey === 'cn_micro') {
      const rows = Object.values(INSTRUMENTS).filter((i) => i.market === 'CN_ASHARE').map((inst) => {
        const up = roundCny(inst.prevClose * (1 + inst.limitPct));
        const dn = roundCny(inst.prevClose * (1 - inst.limitPct));
        const nbLatest = inst.nbFlows[inst.nbFlows.length - 1].flow;
        return {
          code: `${inst.symbol} (${inst.localName})`, board: inst.board,
          last_cny: `¥${inst.last.close.toFixed(2)}`,
          limit_up: `¥${up.toFixed(2)}`, limit_down: `¥${dn.toFixed(2)}`,
          nb_hold_pct: `${inst.nbHoldPct}%`, nb_flow_today: fmtCompact(nbLatest, 'CNY'),
        };
      });
      return { cols: ['code', 'board', 'last_cny', 'limit_up', 'limit_down', 'nb_hold_pct', 'nb_flow_today'], rows, chart: null, ms: (performance.now() - t0).toFixed(2) };
    }
    // Dual-SMA Momentum Backtest on BTC-USD
    const c = INSTRUMENTS['CR:SPOT:BTC-USD'].candles;
    let eq = 100, bm = 100, peak = 100, maxDd = 0, wins = 0, active = 0;
    const stratRets = [];
    const curve = [];
    for (let i = 30; i < c.length; i++) {
      const sma10 = c.slice(i - 10, i).reduce((s, x) => s + x.close, 0) / 10;
      const sma30 = c.slice(i - 30, i).reduce((s, x) => s + x.close, 0) / 30;
      const sig = sma10 > sma30 ? 1 : 0;
      const r = (c[i].close - c[i - 1].close) / c[i - 1].close;
      const sr = sig * r;
      stratRets.push(sr);
      if (sig) { active++; if (sr > 0) wins++; }
      eq *= (1 + sr);
      bm *= (1 + r);
      if (eq > peak) peak = eq;
      maxDd = Math.min(maxDd, (eq - peak) / peak);
      curve.push({ date: c[i].date, strategy: eq, benchmark: bm });
    }
    const mean = stratRets.reduce((a, b) => a + b, 0) / stratRets.length;
    const sd = Math.sqrt(stratRets.reduce((a, b) => a + (b - mean) ** 2, 0) / (stratRets.length - 1));
    const sharpe = sd > 0 ? (mean / sd) * Math.sqrt(365) : 0;
    return {
      cols: ['strategy', 'total_return', 'buy_and_hold', 'sharpe', 'max_drawdown', 'win_rate'],
      rows: [{
        strategy: 'SMA(10)/SMA(30) Long/Flat on BTC-USD',
        total_return: `${(eq - 100).toFixed(2)}%`,
        buy_and_hold: `${(bm - 100).toFixed(2)}%`,
        sharpe: sharpe.toFixed(2),
        max_drawdown: `${(maxDd * 100).toFixed(2)}%`,
        win_rate: `${active ? ((wins / active) * 100).toFixed(1) : '0.0'}%`,
      }],
      chart: curve,
      ms: (performance.now() - t0).toFixed(2),
    };
  }

  function getThemeColors() {
    const cs = getComputedStyle(document.documentElement);
    const get = (k, fb) => (cs.getPropertyValue(k) || '').trim() || fb;
    return {
      bg: get('--background', '#0b0f17'),
      card: get('--card', '#111827'),
      border: get('--border', '#263245'),
      text: get('--foreground', '#e5e7eb'),
      muted: get('--muted-foreground', '#94a3b8'),
      success: get('--success', '#10b981'),
      error: get('--error', '#f43f5e'),
      warning: get('--warning', '#f59e0b'),
      primary: get('--primary', '#38bdf8'),
      charts: [
        get('--chart-1', '#f59e0b'),
        get('--chart-2', '#38bdf8'),
        get('--chart-3', '#10b981'),
        get('--chart-4', '#f43f5e'),
      ],
    };
  }

  function drawCandleChart(canvas, inst) {
    if (!canvas) return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width < 40 || rect.height < 40) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;
    const th = getThemeColors();

    ctx.fillStyle = th.bg;
    ctx.fillRect(0, 0, W, H);

    const bars = inst.candles.slice(-110);
    const padL = 8, padR = 58, padT = 14, padB = 22;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;
    const minP = Math.min(...bars.map((b) => b.low)) * 0.992;
    const maxP = Math.max(...bars.map((b) => b.high)) * 1.008;
    const maxV = Math.max(...bars.map((b) => b.volume));
    const yOf = (p) => padT + ((maxP - p) / (maxP - minP || 1)) * (plotH * 0.82);
    const stepX = plotW / bars.length;

    // Grid lines & price labels
    ctx.strokeStyle = th.border;
    ctx.lineWidth = 0.5;
    ctx.font = '12px ui-monospace, monospace';
    ctx.fillStyle = th.muted;
    for (let g = 0; g <= 4; g++) {
      const p = minP + (g / 4) * (maxP - minP);
      const y = yOf(p);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillText(p >= 1000 ? p.toFixed(0) : p.toFixed(2), W - padR + 4, y + 4);
    }

    // Volume Profile (horizontal bars on right edge)
    if (state.gpOverlays.vp) {
      const bins = 16;
      const hist = new Array(bins).fill(0);
      bars.forEach((b) => {
        const idx = Math.min(bins - 1, Math.max(0, Math.floor(((b.close - minP) / (maxP - minP || 1)) * bins)));
        hist[idx] += b.volume;
      });
      const maxH = Math.max(...hist) || 1;
      const poc = hist.indexOf(maxH);
      for (let i = 0; i < bins; i++) {
        const p0 = minP + (i / bins) * (maxP - minP);
        const p1 = minP + ((i + 1) / bins) * (maxP - minP);
        const y0 = yOf(p1), y1 = yOf(p0);
        const bw = (hist[i] / maxH) * (plotW * 0.16);
        ctx.fillStyle = i === poc ? th.warning : th.primary;
        ctx.globalAlpha = i === poc ? 0.35 : 0.14;
        ctx.fillRect(W - padR - bw, y0, bw, Math.max(1, y1 - y0 - 1));
      }
      ctx.globalAlpha = 1;
    }

    // Volume histogram at bottom 18%
    const volBaseY = padT + plotH;
    bars.forEach((b, i) => {
      const x = padL + i * stepX;
      const vh = (b.volume / (maxV || 1)) * (plotH * 0.16);
      ctx.fillStyle = b.close >= b.open ? th.success : th.error;
      ctx.globalAlpha = 0.28;
      ctx.fillRect(x + 1, volBaseY - vh, Math.max(1, stepX - 2), vh);
    });
    ctx.globalAlpha = 1;

    // Candlesticks
    bars.forEach((b, i) => {
      const cx = padL + (i + 0.5) * stepX;
      const isUp = b.close >= b.open;
      ctx.strokeStyle = isUp ? th.success : th.error;
      ctx.fillStyle = isUp ? th.success : th.error;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, yOf(b.high)); ctx.lineTo(cx, yOf(b.low)); ctx.stroke();
      const top = yOf(Math.max(b.open, b.close));
      const bot = yOf(Math.min(b.open, b.close));
      ctx.fillRect(cx - Math.max(1.5, stepX * 0.32), top, Math.max(3, stepX * 0.64), Math.max(1.5, bot - top));
    });

    // Moving averages
    const drawMa = (period, color) => {
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      let started = false;
      for (let i = period - 1; i < bars.length; i++) {
        const avg = bars.slice(i - period + 1, i + 1).reduce((s, x) => s + x.close, 0) / period;
        const x = padL + (i + 0.5) * stepX, y = yOf(avg);
        if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
    };
    if (state.gpOverlays.sma20) drawMa(20, th.warning);
    if (state.gpOverlays.sma50) drawMa(50, th.primary);

    // Date axis labels
    ctx.fillStyle = th.muted;
    ctx.font = '12px ui-monospace, monospace';
    [0, Math.floor(bars.length / 2), bars.length - 1].forEach((idx) => {
      const x = Math.min(W - padR - 68, padL + idx * stepX);
      ctx.fillText(bars[idx].date.slice(5), x, H - 5);
    });
  }

  function drawLineSeriesChart(canvas, seriesList) {
    if (!canvas || !seriesList.length) return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width < 40 || rect.height < 40) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(rect.width * dpr);
    canvas.height = Math.floor(rect.height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height;
    const th = getThemeColors();
    ctx.fillStyle = th.bg;
    ctx.fillRect(0, 0, W, H);

    const allVals = seriesList.flatMap((s) => s.values);
    const minV = Math.min(...allVals) * 0.98;
    const maxV = Math.max(...allVals) * 1.02;
    const padL = 10, padR = 52, padT = 14, padB = 20;
    const yOf = (v) => padT + ((maxV - v) / (maxV - minV || 1)) * (H - padT - padB);

    ctx.strokeStyle = th.border; ctx.lineWidth = 0.5;
    ctx.font = '12px ui-monospace, monospace'; ctx.fillStyle = th.muted;
    for (let g = 0; g <= 3; g++) {
      const v = minV + (g / 3) * (maxV - minV);
      const y = yOf(v);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillText(v.toFixed(0), W - padR + 5, y + 4);
    }

    seriesList.forEach((s, idx) => {
      ctx.strokeStyle = s.color || th.charts[idx % th.charts.length];
      ctx.lineWidth = 2;
      ctx.beginPath();
      const step = (W - padL - padR) / Math.max(1, s.values.length - 1);
      s.values.forEach((v, i) => {
        const x = padL + i * step, y = yOf(v);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    });
  }

  function renderFa(inst) {
    const latest = inst.fy[inst.fy.length - 1];
    const mcap = inst.last.close * inst.shares;
    const fcf = latest.ocf - latest.capex;
    const gm = latest.rev > 0 ? ((latest.gp / latest.rev) * 100).toFixed(1) + '%' : '—';
    const nm = latest.rev > 0 ? ((latest.ni / latest.rev) * 100).toFixed(1) + '%' : '—';
    const fcfYld = mcap > 0 ? ((fcf / mcap) * 100).toFixed(2) + '%' : '—';

    const tabs = [['IS', 'INCOME STMT'], ['BS', 'BALANCE SHEET'], ['CF', 'CASH FLOW'], ['DCF', 'DCF MODEL']]
      .map(([k, lbl]) => `<button data-fa-tab="${k}" class="px-2 py-1 rounded mono text-xs font-semibold cursor-pointer ${state.faTab === k ? 'bg-[var(--warning)] text-black' : 'bg-[var(--background)] text-[var(--muted-foreground)] border border-[var(--border)]'}">${lbl}</button>`)
      .join('');

    let bodyHtml = '';
    if (state.faTab !== 'DCF') {
      const specs = state.faTab === 'IS'
        ? [['rev', 'Total Revenue / Fees'], ['gp', 'Gross Profit'], ['ebitda', 'EBITDA'], ['ni', 'Net Income']]
        : state.faTab === 'BS'
        ? [['assets', 'Total Assets'], ['cash', 'Cash & Equivalents / TVL'], ['debt', 'Total Debt'], ['eq', 'Shareholders Equity']]
        : [['ocf', 'Operating Cash Flow'], ['capex', 'Capital Expenditure'], ['fcf', 'Free Cash Flow (FCF)']];

      const headers = inst.fy.map((f) => `<th class="text-right">${f.yr}</th>`).join('');
      const rows = specs.map(([key, label]) => {
        const cells = inst.fy.map((f, i) => {
          const val = key === 'fcf' ? (f.ocf - f.capex) : f[key];
          let yoyHtml = '';
          if (i > 0) {
            const prev = key === 'fcf' ? (inst.fy[i - 1].ocf - inst.fy[i - 1].capex) : inst.fy[i - 1][key];
            if (Math.abs(prev) > 1e-6) {
              const g = ((val - prev) / Math.abs(prev)) * 100;
              yoyHtml = `<div class="${g >= 0 ? 'text-[var(--success)]' : 'text-[var(--error)]'}">${g >= 0 ? '+' : ''}${g.toFixed(1)}% YoY</div>`;
            }
          }
          return `<td class="text-right mono"><div>${fmtCompact(val, inst.ccy)}</div>${yoyHtml}</td>`;
        }).join('');
        return `<tr><td class="font-medium">${label}</td>${cells}</tr>`;
      }).join('');
      bodyHtml = `<div class="overflow-x-auto flex-1"><table class="term-table"><thead><tr><th class="text-left">Line Item (${inst.ccy})</th>${headers}</tr></thead><tbody>${rows}</tbody></table></div>`;
    } else {
      const d = calcDcf(inst, state.dcfParams.wacc, state.dcfParams.fcfG, state.dcfParams.termG);
      const matrixRows = d.wAxis.map((w, r) => {
        const tds = d.matrix[r].map((px, c) => {
          const center = r === 2 && c === 2;
          const up = px !== null && px >= d.spot;
          return `<td class="text-right mono ${center ? 'font-bold text-[var(--warning)]' : up ? 'text-[var(--success)]' : 'text-[var(--error)]'}">${px !== null ? fmtPx(px, inst.ccy) : 'N/A'}</td>`;
        }).join('');
        return `<tr><td class="mono font-semibold text-[var(--warning)]">${w.toFixed(2)}%</td>${tds}</tr>`;
      }).join('');
      bodyHtml = `
        <div class="p-3 space-y-3 overflow-y-auto flex-1">

              <input data-dcf="termG" type="range" min="1" max="5" step="0.25" value="${state.dcfParams.termG}" class="w-full accent-[var(--success)] mt-1" />
            </label>

          <div class="grid grid-cols-3 gap-2 mono text-xs">
            <div class="p-2 rounded bg-[var(--background)] border border-[var(--card-border)]"><div class="text-[var(--muted-foreground)]">IMPLIED FAIR VALUE</div><div class="text-sm font-bold text-[var(--warning)]">${fmtPx(d.fairPx, inst.ccy)}</div></div>
            <div class="p-2 rounded bg-[var(--background)] border border-[var(--card-border)]"><div class="text-[var(--muted-foreground)]">CURRENT SPOT</div><div class="text-sm font-bold">${fmtPx(d.spot, inst.ccy)}</div></div>
            <div class="p-2 rounded bg-[var(--background)] border border-[var(--card-border)]"><div class="text-[var(--muted-foreground)]">IMPLIED UPSIDE</div><div class="text-sm font-bold ${d.upside >= 0 ? 'text-[var(--success)]' : 'text-[var(--error)]'}">${d.upside >= 0 ? '+' : ''}${d.upside.toFixed(1)}%</div></div>
          </div>
          <div class="overflow-x-auto">
            <div class="mono text-xs text-[var(--muted-foreground)] mb-1">5×5 SENSITIVITY MATRIX — WACC (Rows) vs TERMINAL GROWTH (Cols)</div>
            <table class="term-table"><thead><tr><th class="text-left">WACC \\ g</th>${d.tAxis.map((t) => `<th class="text-right">${t.toFixed(2)}%</th>`).join('')}</tr></thead><tbody>${matrixRows}</tbody></table>
          </div>
        </div>`;
    }

    return `
      <div class="h-full flex flex-col overflow-hidden text-xs">
        <div class="px-3 py-2 bg-[var(--background)] border-b border-[var(--border)] flex flex-wrap items-center justify-between gap-2">
          <div class="flex flex-wrap gap-1">${tabs}</div>
          <div class="flex flex-wrap gap-2 mono text-xs text-[var(--muted-foreground)]">
            <span>STD: <strong class="text-[var(--primary)]">${inst.finStd}</strong></span>
            <span>GM: <strong>${gm}</strong></span>

            <span>FCF YLD: <strong>${fcfYld}</strong></span>

  }

  function renderGp(pane, inst) {
    const ov = state.gpOverlays;
    const evRibbon = (inst.events || []).map((e) => `<span class="px-1.5 py-0.5 rounded bg-[var(--background)] border border-[var(--border)] mono text-xs"><strong class="text-[var(--warning)]">${e.type}</strong> ${e.title}</span>`).join('');

  function renderComp(pane) {
    const ccy = state.compBaseCcy;

    const rows = pane.compIds.map((id) => {
      const inst = INSTRUMENTS[id];
      if (!inst) return '';
      const fx = toBase(inst.ccy);
      const c = inst.candles;
      const ret = ((c[c.length - 1].close / c[c.length - 91].close) - 1) * 100;
      const fy = inst.fy[inst.fy.length - 1];
      const mcap = inst.last.close * inst.shares * fx;
      const pe = fy.ni > 0 ? (mcap / (fy.ni * fx)).toFixed(1) + 'x' : '—';
      return `<tr><td class="mono font-semibold text-[var(--warning)]">${inst.symbol}</td><td>${inst.market}</td><td class="text-right mono">${fmtPx(inst.last.close * fx, ccy)}</td><td class="text-right mono">${fmtCompact(mcap, ccy)}</td><td class="text-right mono text-[var(--primary)]">${pe}</td><td class="text-right mono font-semibold ${ret >= 0 ? 'text-[var(--success)]' : 'text-[var(--error)]'}">${ret >= 0 ? '+' : ''}${ret.toFixed(1)}%</td></tr>`;

    return `
      <div class="h-full flex flex-col overflow-hidden text-xs">
        <div class="px-3 py-1.5 bg-[var(--background)] border-b border-[var(--border)] flex items-center justify-between mono">

      <div class="flex flex-wrap items-center gap-3 mono">
        <span class="font-bold text-[var(--warning)]">OPENTERM</span>

  function renderOpt(inst) {
    const target = inst.market === 'US' ? inst : INSTRUMENTS['EQ:US:AAPL'];
    const spot = target.last.close;
    const step = spot > 100 ? 5 : 2.5;
    const atm = Math.round(spot / step) * step;
    const strikes = [-3, -2, -1, 0, 1, 2, 3].map((k) => atm + k * step);
    const rows = strikes.map((st) => {
      const m = (spot - st) / spot;
      const iv = (24 + Math.abs(m) * 45 + (target.symbol === 'NVDA' ? 14 : 0)).toFixed(1);
      const cDelta = Math.max(0.05, Math.min(0.95, 0.5 + m * 3.5)).toFixed(2);
      const pDelta = (-Math.max(0.05, Math.min(0.95, 0.5 - m * 3.5))).toFixed(2);
      const cMid = (Math.max(0, spot - st) + spot * (Number(iv) / 100) * 0.12 * Math.exp(-3 * m * m)).toFixed(2);
      const pMid = (Math.max(0, st - spot) + spot * (Number(iv) / 100) * 0.12 * Math.exp(-3 * m * m)).toFixed(2);
      return `<tr><td class="text-right mono text-[var(--warning)]">${iv}%</td><td class="text-right mono text-[var(--primary)]">${cDelta}</td><td class="text-right mono text-[var(--success)]">$${cMid}</td><td class="text-center mono font-bold text-[var(--warning)] bg-[var(--sidebar)]">$${st.toFixed(1)}</td><td class="text-left mono text-[var(--error)]">$${pMid}</td><td class="text-right mono text-[var(--primary)]">${pDelta}</td><td class="text-right mono text-[var(--warning)]">${iv}%</td></tr>`;
    }).join('');
    const hRows = (target.holders13f || []).map((h) => `<tr><td>${h.name}</td><td class="text-right mono text-[var(--primary)]">${h.pct}%</td><td class="text-right mono">${h.qoq}</td></tr>`).join('');
    return `
      <div class="h-full overflow-y-auto p-3 space-y-3 text-xs">
        <div class="flex flex-wrap justify-between gap-2 pb-2 border-b border-[var(--border)] mono">
          <span class="font-bold text-[var(--primary)]">${target.symbol} US OPTIONS STRADDLE CHAIN & SEC 13F</span>
          <span>Spot: <strong>${fmtPx(spot, 'USD')}</strong> · CIK ${target.cik}</span>
        </div>
        <div class="overflow-x-auto rounded border border-[var(--card-border)]"><table class="term-table"><thead><tr><th class="text-right">Call IV</th><th class="text-right">Delta</th><th class="text-right">Call Last</th><th class="text-center">STRIKE</th><th class="text-left">Put Last</th><th class="text-right">Delta</th><th class="text-right">Put IV</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="overflow-x-auto rounded border border-[var(--card-border)]"><table class="term-table"><thead><tr><th class="text-left">SEC 13F Top Holder</th><th class="text-right">% Out</th><th class="text-right">QoQ Change</th></tr></thead><tbody>${hRows}</tbody></table></div>
      </div>`;
  }

  function renderFlow() {
    const cns = Object.values(INSTRUMENTS).filter((i) => i.market === 'CN_ASHARE');
    const totalNb = cns.reduce((s, i) => s + (i.northboundEligible ? i.nbFlows[i.nbFlows.length - 1].flow : 0), 0);
    const rows = cns.map((i) => {
      const up = roundCny(i.prevClose * (1 + i.limitPct));
      const dn = roundCny(i.prevClose * (1 - i.limitPct));
      const chg = ((i.last.close - i.prevClose) / i.prevClose) * 100;
      const nb = i.nbFlows[i.nbFlows.length - 1].flow;
      return `<tr data-jump-row="${i.id}"><td class="mono font-bold text-[var(--warning)]">${i.symbol} ${i.localName}</td><td class="mono">${i.board}</td><td class="text-right mono">¥${i.last.close.toFixed(2)}</td><td class="text-right mono ${chg >= 0 ? 'text-[var(--error)]' : 'text-[var(--success)]'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</td><td class="text-right mono text-[var(--error)]">¥${up.toFixed(2)}</td><td class="text-right mono text-[var(--success)]">¥${dn.toFixed(2)}</td><td class="text-right mono text-[var(--primary)]">${i.northboundEligible ? i.nbHoldPct + '%' : 'BSE'}</td><td class="text-right mono">${i.northboundEligible ? fmtCompact(nb, 'CNY') : '—'}</td></tr>`;
    }).join('');
    return `
      <div class="h-full overflow-y-auto p-3 space-y-3 text-xs">
        <div class="flex flex-wrap justify-between gap-2 pb-2 border-b border-[var(--border)] mono">
          <span class="font-bold text-[var(--error)]">CHINA A-SHARE STOCK CONNECT (北向/南向资金) & 涨跌停 MONITOR</span>
          <span>北向 Today: <strong class="text-[var(--error)]">${fmtCompact(totalNb, 'CNY')}</strong> · T+1 STRICT</span>

        <div class="overflow-x-auto rounded border border-[var(--card-border)]"><table class="term-table"><thead><tr><th class="text-left">Ticker</th><th class="text-left">Board</th><th class="text-right">Last</th><th class="text-right">Chg%</th><th class="text-right">涨停 Up</th><th class="text-right">跌停 Down</th><th class="text-right">北向 Hold</th><th class="text-right">北向 Flow</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>`;
  }

  function renderWorkspace() {
    renderStatusBar();
    const activePane = state.panes.find((p) => p.id === state.activePaneId) || state.panes[0];
    document.getElementById('active-pane-badge').textContent = `P${activePane.idx}`;

    // Layout buttons
    document.getElementById('layout-controls').innerHTML = ['1x1', '1x2', '2x2'].map((l) => `
      <button data-layout="${l}" class="px-2 py-1 rounded cursor-pointer ${state.layout === l ? 'bg-[var(--warning)] text-black font-bold' : 'text-[var(--muted-foreground)]'}">${l}</button>
    `).join('');

    const grid = document.getElementById('workspace-grid');
    grid.className = `flex-1 grid gap-2 p-2 ${state.layout === '1x1' ? 'grid-cols-1' : 'grid-cols-1 lg:grid-cols-2'}`;
    const visiblePanes = state.layout === '1x1' ? [activePane] : state.layout === '1x2' ? state.panes.slice(0, 2) : state.panes;

    grid.innerHTML = visiblePanes.map((pane) => {
      const inst = INSTRUMENTS[pane.instId] || INSTRUMENTS['EQ:US:AAPL'];
      const isActive = pane.id === state.activePaneId;
      const linkColor = pane.linkGroup === 'A' ? 'var(--primary)' : pane.linkGroup === 'B' ? 'var(--warning)' : pane.linkGroup === 'C' ? 'var(--success)' : 'var(--muted-foreground)';
      const fnTabs = FUNCTIONS.map((f) => `<button data-pane-fn="${pane.id}:${f}" class="px-1.5 py-0.5 rounded mono text-xs cursor-pointer ${pane.fn === f ? 'bg-[var(--warning)] text-black font-bold' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">${f}</button>`).join('');

      let content = '';
      if (pane.fn === 'DES') content = renderDes(inst);
      else if (pane.fn === 'FA') content = renderFa(inst);
      else if (pane.fn === 'GP') content = renderGp(pane, inst);
      else if (pane.fn === 'COMP') content = renderComp(pane);
      else if (pane.fn === 'OPT') content = renderOpt(inst);
      else if (pane.fn === 'FLOW') content = renderFlow();
      else if (pane.fn === 'PERP') content = renderPerp();
      else if (pane.fn === 'NEWS') content = renderNews(pane);
      else if (pane.fn === 'PORT') content = renderPort();
      else if (pane.fn === 'BQL') content = renderBql(pane);

      return `
        <section data-pane-box="${pane.id}" class="bg-[var(--card)] border border-[var(--border)] rounded flex flex-col min-h-[380px] overflow-hidden ${isActive ? 'pane-active' : ''}">
          <div class="px-2 py-1.5 bg-[var(--sidebar)] border-b border-[var(--border)] flex flex-wrap items-center justify-between gap-1.5">
            <div class="flex items-center gap-1.5 mono text-xs">
              <span class="px-1.5 py-0.5 rounded font-bold ${isActive ? 'bg-[var(--warning)] text-black' : 'bg-[var(--background)] text-[var(--muted-foreground)]'}">P${pane.idx}</span>
              <button data-cycle-link="${pane.id}" style="border-color:${linkColor};color:${linkColor}" class="px-1.5 py-0.5 rounded border font-semibold cursor-pointer" title="Cycle Link Group (Alt+L)">GRP ${pane.linkGroup}</button>
              <span class="font-bold text-[var(--warning)]">${inst.symbol}</span>
            </div>
            <div class="flex flex-wrap items-center gap-0.5">${fnTabs}</div>
          </div>
          <div class="flex-1 min-h-0 overflow-hidden">${content}</div>
        </section>`;
    }).join('');

    // Draw canvases after layout settles
    requestAnimationFrame(() => drawAllCanvases(visiblePanes));
  }

  function drawAllCanvases(visiblePanes) {
    const panes = visiblePanes || state.panes;
    const th = getThemeColors();
    panes.forEach((pane) => {
      if (pane.fn === 'GP') {
        drawCandleChart(document.getElementById(`gp-canvas-${pane.id}`), INSTRUMENTS[pane.instId]);
      } else if (pane.fn === 'COMP') {
        const series = pane.compIds.map((id, idx) => {
          const cs = INSTRUMENTS[id].candles.slice(-90);
          const base = cs[0].close;
          return { values: cs.map((c) => (c.close / base) * 100), color: th.charts[idx % th.charts.length] };
        });
        drawLineSeriesChart(document.getElementById(`comp-canvas-${pane.id}`), series);
      } else if (pane.fn === 'BQL' && state.bqlResult?.chart) {
        const ch = state.bqlResult.chart;
        drawLineSeriesChart(document.getElementById(`bql-canvas-${pane.id}`), [
          { values: ch.map((x) => x.strategy), color: th.success },
          { values: ch.map((x) => x.benchmark), color: th.muted },
        ]);
      }
    });
  }

  // Quick command chips
  const PRESETS = [
    ['600519 DES', '600519 CH <Equity> DES'],
    ['300750 DES', '300750 CH <Equity> DES'],
    ['AAPL FA', 'AAPL US <Equity> FA'],
    ['BTC GP', 'BTC-USD <Crypto> GP'],
    ['COMP', 'AAPL US, NVDA US, 600519 CH, BTC-USD COMP'],
    ['NEWS', 'NEWS'],
    ['PORT', 'PORT'],
    ['BQL', 'BQL'],
  ];
  document.getElementById('quick-cmds').innerHTML = PRESETS.map(([lbl, cmd]) => `
    <button data-run-cmd="${cmd}" class="px-2 py-1 rounded bg-[var(--background)] hover:border-[var(--warning)] border border-[var(--border)] mono text-xs cursor-pointer">${lbl}</button>
  `).join('');

  // Delegated click & input handlers
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    const paneBox = e.target.closest('[data-pane-box]');
    if (paneBox && paneBox.dataset.paneBox !== state.activePaneId && !btn?.dataset.cycleLink) {
      state.activePaneId = paneBox.dataset.paneBox;
      renderWorkspace();
    }
    if (!btn) return;
    if (btn.dataset.runCmd) { executeCommand(btn.dataset.runCmd); return; }
    if (btn.dataset.layout) { state.layout = btn.dataset.layout; renderWorkspace(); return; }
    if (btn.dataset.tapeId) {
      const p = state.panes.find((x) => x.id === state.activePaneId) || state.panes[0];
      p.instId = btn.dataset.tapeId;
      if (p.linkGroup !== 'NONE') state.panes.forEach((x) => { if (x.linkGroup === p.linkGroup) x.instId = btn.dataset.tapeId; });
      renderWorkspace(); return;
    }
    if (btn.dataset.paneFn) {
      const [pid, fn] = btn.dataset.paneFn.split(':');
      state.activePaneId = pid;
      const p = state.panes.find((x) => x.id === pid);
      if (p) p.fn = fn;
      renderWorkspace(); return;
    }
    if (btn.dataset.cycleLink) {
      const p = state.panes.find((x) => x.id === btn.dataset.cycleLink);
      if (p) p.linkGroup = LINK_CYCLE[(LINK_CYCLE.indexOf(p.linkGroup) + 1) % LINK_CYCLE.length];
      renderWorkspace(); return;
    }
    if (btn.dataset.faTab) { state.faTab = btn.dataset.faTab; renderWorkspace(); return; }
    if (btn.dataset.gpOv) { state.gpOverlays[btn.dataset.gpOv] = !state.gpOverlays[btn.dataset.gpOv]; renderWorkspace(); return; }
    if (btn.dataset.compCcy) { state.compBaseCcy = btn.dataset.compCcy; renderWorkspace(); return; }
    if (btn.dataset.portCcy) { state.portBaseCcy = btn.dataset.portCcy; renderWorkspace(); return; }
    if (btn.dataset.newsScope) { state.newsFilter.scopeActive = !state.newsFilter.scopeActive; renderWorkspace(); return; }
    if ('newsLang' in btn.dataset) { state.newsFilter.lang = btn.dataset.newsLang; renderWorkspace(); return; }
    if (btn.dataset.jumpTicker) { executeCommand(`${btn.dataset.jumpTicker} DES`); return; }
    if (btn.dataset.bqlRun) { state.bqlResult = runBqlTemplate(state.bqlQuery); renderWorkspace(); return; }
  });

  document.addEventListener('input', (e) => {
    if (e.target.dataset.dcf) {
      state.dcfParams[e.target.dataset.dcf] = parseFloat(e.target.value);
      renderWorkspace();
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.dataset.bqlSelect) {
      state.bqlQuery = e.target.value;
      state.bqlResult = runBqlTemplate(state.bqlQuery);
      renderWorkspace();
    }
  });

  // Command bar autocomplete & keyboard shortcuts
  const cmdInput = document.getElementById('cmd-input');
  const dropdown = document.getElementById('cmd-dropdown');
  function updateDropdown() {
    const q = cmdInput.value.trim().toUpperCase();
    const items = [
      ...Object.values(INSTRUMENTS).map((i) => ({
        cmd: i.market === 'US' ? `${i.symbol} US <Equity> DES` : i.market === 'CN_ASHARE' ? `${i.symbol} CH <Equity> DES` : `${i.symbol} <Crypto> GP`,
        detail: `${i.name} ${i.localName} (${i.market})`,
      })),
      { cmd: 'AAPL US, NVDA US, 600519 CH, BTC-USD COMP', detail: 'Cross-Market FX-Normalized Peer Comparison' },
      { cmd: 'PORT', detail: 'Multi-Currency Portfolio & VaR Risk Matrix' },
      { cmd: 'BQL', detail: 'Programmable SQL & Python Backtest Console' },
      { cmd: 'NEWS', detail: 'Bilingual EN/ZH News & Filings Feed' },
    ].filter((x) => !q || x.cmd.toUpperCase().includes(q) || x.detail.toUpperCase().includes(q)).slice(0, 8);
    if (!items.length) { dropdown.classList.add('hidden'); return; }
    dropdown.innerHTML = items.map((x) => `
      <button type="button" data-ac-cmd="${x.cmd}" class="w-full text-left px-3 py-1.5 hover:bg-[var(--sidebar)] flex items-center justify-between gap-2 text-xs cursor-pointer border-b border-[var(--card-border)]">
        <span class="mono font-semibold text-[var(--warning)]">${x.cmd}</span>
        <span class="text-[var(--muted-foreground)] truncate">${x.detail}</span>
      </button>`).join('');
    dropdown.classList.remove('hidden');
  }
  dropdown.addEventListener('mousedown', (e) => {
    const b = e.target.closest('button');
    if (b?.dataset.acCmd) {
      e.preventDefault();
      cmdInput.value = '';
      dropdown.classList.add('hidden');
      executeCommand(b.dataset.acCmd);
    }
  });
  cmdInput.addEventListener('focus', updateDropdown);
  cmdInput.addEventListener('input', updateDropdown);
  cmdInput.addEventListener('blur', () => setTimeout(() => dropdown.classList.add('hidden'), 150));
  cmdInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      const val = cmdInput.value;
      cmdInput.value = '';
      dropdown.classList.add('hidden');
      executeCommand(val);
    } else if (e.key === 'Escape') {
      cmdInput.value = ''; dropdown.classList.add('hidden'); cmdInput.blur();
    } else if (e.key === 'F2') {
      e.preventDefault(); cmdInput.value = `${cmdInput.value.trim()} <Equity> `;
    } else if (e.key === 'F3') {
      e.preventDefault(); cmdInput.value = `${cmdInput.value.trim()} <Crypto> `;
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== cmdInput && e.target.tagName !== 'INPUT') {
      e.preventDefault(); cmdInput.focus(); updateDropdown();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault(); cmdInput.focus(); cmdInput.select(); updateDropdown();
    } else if (e.altKey && ['1', '2', '3', '4'].includes(e.key)) {
      e.preventDefault(); state.activePaneId = `pane-${e.key}`; renderWorkspace();
    } else if (e.altKey && e.key.toLowerCase() === 'l') {
      e.preventDefault();
      const p = state.panes.find((x) => x.id === state.activePaneId);
      if (p) { p.linkGroup = LINK_CYCLE[(LINK_CYCLE.indexOf(p.linkGroup) + 1) % LINK_CYCLE.length]; renderWorkspace(); }
    }
  });

  window.addEventListener('resize', () => drawAllCanvases());
  window.addEventListener('themechange', () => drawAllCanvases());

  // Live micro-tick simulation (respects China A-Share price-limit clamping)
  setInterval(() => {
    Object.values(INSTRUMENTS).forEach((inst) => {
      const sigma = inst.market === 'CRYPTO' ? 0.0012 : 0.0005;
      let nxt = inst.last.close * (1 + gauss() * sigma);
      if (inst.market === 'CN_ASHARE' && inst.limitPct) {
        const up = roundCny(inst.prevClose * (1 + inst.limitPct));
        const dn = roundCny(inst.prevClose * (1 - inst.limitPct));
        nxt = Math.min(up, Math.max(dn, roundCny(nxt)));
      } else {
        nxt = Number(nxt.toFixed(2));
      }
      inst.last.close = nxt;
      inst.last.high = Math.max(inst.last.high, nxt);
      inst.last.low = Math.min(inst.last.low, nxt);
    });
    renderStatusBar();
    state.panes.forEach((p) => {
      if (p.fn === 'GP') drawCandleChart(document.getElementById(`gp-canvas-${p.id}`), INSTRUMENTS[p.instId]);
    });
  }, 2200);

  renderWorkspace();
})();
</script>
</body>
</html>
