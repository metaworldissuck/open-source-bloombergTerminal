  <title>OpenTerm — Live Multi-Asset Quantitative Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --background: #070a0f;
      --sidebar: #0b1018;
      --card: #0e141e;
      --card-border: #192231;
      --border: #243146;
      --foreground: #e4eaf3;
      --muted-foreground: #8f9fb5;
      --placeholder: #5c6e87;
      --primary: #38bdf8;
      --warning: #f59e0b;
      --success: #10b981;
      --error: #f43f5e;
      --chart-1: #f59e0b;
      --chart-2: #38bdf8;
      --chart-3: #10b981;
      --chart-4: #f43f5e;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-variant-numeric: tabular-nums; }
    .term-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .term-table th { position: sticky; top: 0; background: var(--sidebar); color: var(--muted-foreground); font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .term-table td { padding: 5px 8px; border-bottom: 1px solid var(--card-border); white-space: nowrap; }
    .term-table tbody tr:hover { background: rgba(56, 189, 248, 0.08); }
    .pane-active { outline: 2px solid var(--warning); outline-offset: -1px; }
    canvas { display: block; }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased m-0 p-0">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Top Market Sessions & Real-Time Ticker Strip -->
    <div id="status-bar" class="flex flex-wrap items-center justify-between gap-2 px-3 py-1.5 bg-[var(--sidebar)] border-b border-[var(--border)] text-xs"></div>

    <!-- Global Mnemonic Command Bar -->
    <header class="px-3 py-2 bg-[var(--card)] border-b border-[var(--border)]">
      <div class="flex flex-wrap items-center gap-2">
        <div class="relative flex-1 min-w-[260px]">
          <div class="flex items-center gap-2 px-2.5 py-1.5 rounded bg-[var(--background)] border border-[var(--warning)]">
            <span id="active-pane-badge" class="mono text-xs font-bold px-1.5 py-0.5 rounded bg-[var(--warning)] text-black">P1</span>
            <input
              id="cmd-input"
              type="text"
              autocomplete="off"
              spellcheck="false"
              placeholder="Any live ticker: AAPL US DES | TSLA US GP | 600519 CH FA | 000001 CH GP | BTC-USD GP | PORT | BQL  (Press /)"
              class="w-full bg-transparent text-[var(--foreground)] placeholder-[var(--placeholder)] mono text-xs outline-none"
            />
            <span class="hidden sm:inline mono text-xs text-[var(--muted-foreground)]">F2 EQ · F3 CR</span>
          </div>
          <div id="cmd-dropdown" class="hidden absolute left-0 right-0 mt-1 bg-[var(--card)] border border-[var(--border)] rounded shadow-xl max-h-72 overflow-y-auto z-50"></div>
        </div>

        <div class="flex flex-wrap items-center gap-1" id="quick-cmds"></div>

        <div class="flex items-center gap-1.5">
          <button id="btn-refresh-all" class="px-2 py-1 rounded bg-[var(--background)] border border-[var(--success)] text-[var(--success)] mono text-xs font-semibold cursor-pointer hover:opacity-80" title="Re-fetch live prices from OKX, Coinbase, EastMoney, DefiLlama & ER-API">↻ LIVE SYNC</button>
          <div class="flex items-center gap-1 bg-[var(--background)] border border-[var(--border)] rounded p-0.5 mono text-xs" id="layout-controls"></div>
        </div>
      </div>
      <div id="cmd-error" class="hidden mt-1.5 px-2.5 py-1 rounded border border-[var(--error)] text-[var(--error)] mono text-xs"></div>
    </header>

    <!-- Multi-Pane Workspace Grid -->
    <main id="workspace-grid" class="flex-1 grid gap-2 p-2"></main>

    <!-- Footer -->
    <footer class="px-3 py-1 bg-[var(--sidebar)] border-t border-[var(--border)] flex flex-wrap items-center justify-between gap-2 text-xs mono text-[var(--muted-foreground)]">
      <div class="flex flex-wrap items-center gap-3">
        <span><strong class="text-[var(--warning)]">/</strong> Command</span>
        <span><strong class="text-[var(--warning)]">Alt+1..4</strong> Focus Pane</span>
        <span><strong class="text-[var(--warning)]">Alt+L</strong> Link Group</span>
        <span><strong class="text-[var(--warning)]">F2/F3</strong> &lt;Equity&gt;/&lt;Crypto&gt;</span>
      </div>
      <div id="footer-provenance">LIVE FEEDS: OKX + Coinbase WS (Crypto) · EastMoney (US & China A-Shares) · DefiLlama (TVL/DEX) · ER-API (FX)</div>
    </footer>
  </div>

  function fetchJsonp(url, cbParam = 'cb', timeoutMs = 5000) {
    return new Promise((resolve, reject) => {
      const cbName = `__ot_cb_${Date.now()}_${Math.floor(Math.random() * 1e6)}`;
      const script = document.createElement('script');
      const sep = url.includes('?') ? '&' : '?';
      let done = false;
      const cleanup = () => {
        if (done) return;
        done = true;
        delete window[cbName];
        script.remove();
      };
      const timer = setTimeout(() => { cleanup(); reject(new Error('JSONP timeout')); }, timeoutMs);
      window[cbName] = (data) => { clearTimeout(timer); cleanup(); resolve(data); };
      script.onerror = () => { clearTimeout(timer); cleanup(); reject(new Error('JSONP load error')); };
      script.src = `${url}${sep}${cbParam}=${cbName}`;
      document.head.appendChild(script);
    });
  }

  // Load real-time Market Cap, P/E, P/B, Turnover Rate, 52W High/Low, and Exact 涨停/跌停 via Tencent Finance JS
  function fetchTencentLiveSnapshot(inst) {
    return new Promise((resolve) => {
      let qCode = null;
      if (inst.market === 'CN_ASHARE') {
        const prefix = inst.symbol.startsWith('6') ? 'sh' : (inst.symbol.startsWith('920') || inst.symbol.startsWith('43') || inst.symbol.startsWith('83') || inst.symbol.startsWith('87')) ? 'bj' : 'sz';
        qCode = `${prefix}${inst.symbol}`;
      } else if (inst.market === 'US') {
        qCode = `us${inst.symbol}`;
      } else if (inst.market === 'HK') {
        qCode = `hk${inst.symbol.padStart(5, '0')}`;
      }
      if (!qCode) { resolve(false); return; }

      const varName = `v_${qCode}`;
      const script = document.createElement('script');
      script.charset = 'gbk';
      const timer = setTimeout(() => { script.remove(); resolve(false); }, 4500);
      script.onload = () => {
        clearTimeout(timer);
        try {
          const raw = window[varName];
          if (typeof raw === 'string' && raw.includes('~')) {
            const p = raw.split('~');
            const livePx = Number(p[3]);
            const prevClose = Number(p[4]);
            if (livePx > 0 && inst.last) {
              inst.last.close = livePx;
              if (prevClose > 0) inst.prevClose = prevClose;
            }
            const turnover = Number(p[38]);
            const pe = Number(p[39]);
            const mcapYi = Number(p[45]);
            if (!Number.isNaN(turnover) && turnover > 0) inst.liveTurnoverPct = turnover;
            if (!Number.isNaN(pe) && pe !== 0) inst.livePe = pe;
            if (!Number.isNaN(mcapYi) && mcapYi > 0) inst.liveMarketCap = mcapYi * 1e8;

            if (inst.market === 'CN_ASHARE') {
              const pb = Number(p[46]);
              const limUp = Number(p[47]);
              const limDn = Number(p[48]);
              if (p[1]) inst.localName = p[1];
              if (!Number.isNaN(pb) && pb > 0) inst.livePb = pb;
              if (!Number.isNaN(limUp) && limUp > 0) inst.exactLimitUp = limUp;
              if (!Number.isNaN(limDn) && limDn > 0) inst.exactLimitDown = limDn;
            } else if (inst.market === 'US') {
              if (p[46] && p[46].length > 1) inst.name = p[46];
              if (p[1]) inst.localName = p[1];
              const h52 = Number(p[48]), l52 = Number(p[49]);
              if (h52 > 0) inst.high52 = h52;
              if (l52 > 0) inst.low52 = l52;
            } else if (inst.market === 'HK') {
              if (p[1]) inst.localName = p[1];
            }
          }
        } catch {}
        script.remove();
        resolve(true);
      };
      script.onerror = () => { clearTimeout(timer); script.remove(); resolve(false); };
      script.src = `https://qt.gtimg.cn/q=${encodeURIComponent(qCode)}`;
      document.head.appendChild(script);
    });
  }

  async function searchGlobalSecurities(rawQuery) {
    const q = rawQuery.trim();
    if (!q) return [];
    const cacheKey = q.toUpperCase();
    if (SEARCH_CACHE.has(cacheKey)) return SEARCH_CACHE.get(cacheKey);

    const results = [];
    const seen = new Set();
    const pushUnique = (item) => {
      if (!seen.has(item.canonicalId)) {
        seen.add(item.canonicalId);
        results.push(item);
      }
    };

    const qUp = q.toUpperCase();
    // 1. Fast match against OKX 500+ live crypto spot pairs
    OKX_SPOT_CATALOG.forEach((c) => {
      if (results.length >= 6) return;
      if (c.base === qUp || c.base.startsWith(qUp) || c.instId.startsWith(qUp)) {
        pushUnique({
          canonicalId: `CR:SPOT:${c.base}-USD`,
          symbol: `${c.base}-USD`,
          name: `${c.base} Spot / Perp (OKX Live $${c.last < 1 ? c.last.toFixed(5) : c.last.toFixed(2)})`,
          market: 'CRYPTO',
          badge: 'CRYPTO',
          cmd: `${c.base}-USD <Crypto> DES`,
          meta: { okxSpot: c.instId, okxSwap: `${c.base}-USDT-SWAP`, coinbaseId: `${c.base}-USD`, base: c.base },
        });
      }
    });

    // 2. Parallel Universal Live Search: EastMoney (All US + China A-Shares + HK) & CoinGecko (All Crypto Names)
    const [emData, cgData] = await Promise.all([
      fetchJsonp(
        `https://searchapi.eastmoney.com/api/suggest/get?input=${encodeURIComponent(q)}&type=14&token=D43BF722C8E33BDC906FB84D85E326E8&count=12`,
        'cb',
        4500,
      ).catch(() => null),
      q.length >= 2
        ? fetch(`https://api.coingecko.com/api/v3/search?query=${encodeURIComponent(q)}`).then((r) => r.json()).catch(() => null)
        : Promise.resolve(null),
    ]);

    const emList = emData?.QuotationCodeTable?.Data;
    if (Array.isArray(emList)) {
      emList.forEach((row) => {
        const code = String(row.Code || '').trim();
        const name = String(row.Name || code).trim();
        const quoteId = String(row.QuoteID || '').trim();
        const secType = String(row.SecurityTypeName || '');
        const classify = String(row.Classify || '');
        if (!code || !quoteId) return;

        if (classify === 'AStock' || ['沪A', '深A', '京A', '科创板', '创业板'].includes(secType)) {
          const isStar = code.startsWith('688') || code.startsWith('689');
          const isChiNext = code.startsWith('300') || code.startsWith('301');
          const isBse = code.startsWith('920') || code.startsWith('43') || code.startsWith('83') || code.startsWith('87');
          const isSse = quoteId.startsWith('1.');
          const exch = isBse ? 'BSE' : isSse ? 'SSE' : 'SZSE';
          pushUnique({
            canonicalId: `EQ:${exch}:${code}`,
            symbol: code,
            name: `${name} (${secType || exch})`,
            localName: name,
            market: 'CN_ASHARE',
            badge: `CN ${exch}`,
            cmd: `${code} CH <Equity> DES`,
            meta: { eastmoneySecid: quoteId, exch, isStar, isChiNext, isBse, isSse },
          });
        } else if (classify === 'UsStock' || secType === '美股') {
          pushUnique({
            canonicalId: `EQ:US:${code.toUpperCase()}`,
            symbol: code.toUpperCase(),
            name: `${name} (US ${row.JYS || 'Equity'})`,
            localName: name,
            market: 'US',
            badge: 'US',
            cmd: `${code.toUpperCase()} US <Equity> DES`,
            meta: { eastmoneySecid: quoteId, exchange: row.JYS || 'US' },
          });
        } else if (classify === 'HK' || secType === '港股') {
          pushUnique({
            canonicalId: `EQ:HK:${code}`,
            symbol: code,
            name: `${name} (HKEX)`,
            localName: name,
            market: 'HK',
            badge: 'HK',
            cmd: `${code} HK <Equity> DES`,
            meta: { eastmoneySecid: quoteId, exchange: 'HKEX' },
          });
        }
      });
    }

    if (Array.isArray(cgData?.coins)) {
      cgData.coins.slice(0, 4).forEach((c) => {
        const base = String(c.symbol || '').toUpperCase();
        if (!base) return;
        const okxHit = OKX_SPOT_CATALOG.find((x) => x.base === base);
        if (okxHit) {
          pushUnique({
            canonicalId: `CR:SPOT:${base}-USD`,
            symbol: `${base}-USD`,

            meta: { okxSpot: okxHit.instId, okxSwap: `${base}-USDT-SWAP`, coinbaseId: `${base}-USD`, base },
          });
        }
      });
    }

    const sliced = results.slice(0, 10);
    SEARCH_CACHE.set(cacheKey, sliced);
    return sliced;
  }

  async function fetchEastMoneyInstrument(inst) {
    const secids = inst.eastmoneySecid
      ? [inst.eastmoneySecid]
      : inst.market === 'US'
        ? [`105.${inst.symbol}`, `106.${inst.symbol}`, `107.${inst.symbol}`]
        : [inst.symbol.startsWith('6') ? `1.${inst.symbol}` : `0.${inst.symbol}`];

    for (const sid of secids) {
      try {
        const url = `https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${encodeURIComponent(sid)}&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57&klt=101&fqt=1&end=20500101&lmt=180`;
        const resp = await fetch(url);
        const json = await resp.json();
        const klines = json?.data?.klines;
        if (!Array.isArray(klines) || klines.length < 2) continue;

        const candles = klines.map((line) => {
          // Format: date,open,close,high,low,vol,turnover
          const [date, o, c, h, l, v, amt] = line.split(',');
          const volNum = inst.market === 'CN_ASHARE' ? Number(v) * 100 : Number(v);
          return {
            date,
            open: Number(o),
            close: Number(c),
            high: Number(h),
            low: Number(l),
            volume: volNum,
            turnover: Number(amt || 0),
          };
        });
        inst.eastmoneySecid = sid;
        if (json.data.name && !inst.localName && inst.market === 'CN_ASHARE') {
          inst.localName = json.data.name;
          inst.name = json.data.name;
        }
        inst.candles = candles;
        inst.last = candles[candles.length - 1];
        inst.prevClose = candles[candles.length - 2].close;
        inst.high52 = Math.max(...candles.map((b) => b.high));
        inst.low52 = Math.min(...candles.map((b) => b.low));
        inst.liveSource = 'LIVE · EastMoney + Tencent';
        inst.liveUpdatedAt = inst.last.date;
        inst.loadError = null;
        await fetchTencentLiveSnapshot(inst);
        return true;
      } catch (err) {
        inst.loadError = err.message;
      }
    }
    return false;
  }

        high: Number(c[2]),
        low: Number(c[3]),
        close: Number(c[4]),
        volume: Number(c[5]),
        turnover: Number(c[7] || 0),
      }));

      const t = tickerRes?.data?.[0];
      if (t) {
        const livePx = Number(t.last);
        const lastBar = candles[candles.length - 1];
        lastBar.close = livePx;
        lastBar.high = Math.max(lastBar.high, Number(t.high24h || livePx));
        lastBar.low = Math.min(lastBar.low, Number(t.low24h || livePx));
        inst.prevClose = Number(t.open24h || candles[candles.length - 2].close);

            date: new Date(Number(c[0]) * 1000).toISOString().slice(0, 10),
            low: Number(c[1]), high: Number(c[2]), open: Number(c[3]), close: Number(c[4]), volume: Number(c[5]),

          if (stats?.last) candles[candles.length - 1].close = Number(stats.last);
          inst.candles = candles;
          inst.last = candles[candles.length - 1];

  // Real-Time Coinbase Exchange Public WebSocket for Live Crypto Ticks
  function startLiveCryptoWebSocket() {
    let ws;
    function connect() {
      try {
        ws = new WebSocket('wss://ws-feed.exchange.coinbase.com');
        ws.onopen = () => {
          wsStatus = 'LIVE WS';
          const productIds = Object.values(INSTRUMENTS).filter((i) => i.coinbaseId).map((i) => i.coinbaseId);
          ws.send(JSON.stringify({ type: 'subscribe', product_ids: productIds, channels: ['ticker'] }));
          renderStatusBar();
        };
        ws.onmessage = (evt) => {
          try {
            const msg = JSON.parse(evt.data);
            if (msg.type === 'ticker' && msg.price && msg.product_id) {
              const inst = Object.values(INSTRUMENTS).find((i) => i.coinbaseId === msg.product_id);
              if (inst && inst.last) {
                const px = Number(msg.price);
                inst.last.close = px;
                inst.last.high = Math.max(inst.last.high, px);
                inst.last.low = Math.min(inst.last.low, px);
                if (msg.open_24h) inst.prevClose = Number(msg.open_24h);
                inst.liveUpdatedAt = new Date().toISOString().slice(11, 19) + ' UTC';
                if (inst.crypto && inst.crypto.oiCoins) inst.crypto.oiUsd = inst.crypto.oiCoins * px;
                renderStatusBar();
                state.panes.forEach((p) => {
                  if (p.instId === inst.id && p.fn === 'GP') {
                    drawCandleChart(document.getElementById(`gp-canvas-${p.id}`), inst);
                  }
                });
              }
            }
          } catch {}
        };
        ws.onclose = () => {
          wsStatus = 'RECONNECTING';
          renderStatusBar();
          setTimeout(connect, 5000);
        };
        ws.onerror = () => ws.close();
      } catch {
        wsStatus = 'POLL';
      }
    }
    connect();
  }

  function fmtCompact(v, ccy) {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    const sign = v < 0 ? '-' : '';
    const a = Math.abs(v);
    const sym = ccy === 'CNY' ? '¥' : ccy === 'USD' || ccy === 'USDT' ? '$' : '';
    if (a >= 1e12) return `${sign}${sym}${(a / 1e12).toFixed(2)}T`;
    if (a >= 1e9) return `${sign}${sym}${(a / 1e9).toFixed(2)}B`;
    if (a >= 1e6) return `${sign}${sym}${(a / 1e6).toFixed(2)}M`;
    if (a >= 1e3) return `${sign}${sym}${(a / 1e3).toFixed(1)}K`;
    return `${sign}${sym}${a.toFixed(2)}`;
  }
  function fmtPx(v, ccy) {
    if (v === null || v === undefined || Number.isNaN(v)) return '—';
    const sym = ccy === 'CNY' ? '¥' : ccy === 'USD' || ccy === 'USDT' ? '$' : '';
    const d = Math.abs(v) < 10 ? 4 : 2;
    return `${sym}${Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })}`;
  }

  async function executeCommand(rawCmd, targetPaneId) {

  // =========================================================================
  // 4. ANALYTICS ENGINES OVER REAL LIVE DATA
  // =========================================================================
  function calcDcf(inst, waccPct, fcfGPct, termGPct) {
    if (!inst.fy.length || !inst.last) return null;
    const wacc = Math.max(termGPct / 100 + 0.01, waccPct / 100);
    const tg = termGPct / 100, fg = fcfGPct / 100;
    const latest = inst.fy[inst.fy.length - 1];
    const baseFcf = Math.max(1e6, latest.ocf - latest.capex);
    const evalPx = (rw, rtg) => {
      if (rw <= rtg + 0.005) return null;
      let f = baseFcf, pvSum = 0;
      for (let yr = 1; yr <= 5; yr++) {
        f *= (1 + fg - (fg - rtg) * ((yr - 1) / 9));
        pvSum += f / Math.pow(1 + rw, yr);
      }
      const ev = pvSum + ((f * (1 + rtg)) / (rw - rtg)) / Math.pow(1 + rw, 5);
      return (ev + latest.cash - latest.debt) / inst.shares;
    };
    const fairPx = evalPx(wacc, tg) || 0;
    const spot = inst.last.close;
    const wAxis = [-1.5, -0.75, 0, 0.75, 1.5].map((d) => Number(Math.max(4, waccPct + d).toFixed(2)));
    const tAxis = [-1.0, -0.5, 0, 0.5, 1.0].map((d) => Number(Math.max(0.5, termGPct + d).toFixed(2)));
    return { fairPx, spot, upside: ((fairPx - spot) / spot) * 100, wAxis, tAxis, matrix: wAxis.map((w) => tAxis.map((t) => evalPx(w / 100, t / 100))) };
  }

  function computePortfolio(baseCcy) {
    const usdCny = FX.USD_CNY || 7.0;
    const toBase = (ccy) => {
      if (ccy === baseCcy || (ccy === 'USD' && baseCcy === 'USDT')) return 1.0;
      if (ccy === 'CNY' && (baseCcy === 'USD' || baseCcy === 'USDT')) return 1 / usdCny;
      if ((ccy === 'USD' || ccy === 'USDT') && baseCcy === 'CNY') return usdCny;
      return 1.0;
    };
    const readyLots = PORTFOLIO_LOTS.filter((l) => INSTRUMENTS[l.id]?.candles?.length >= 30);
    if (!readyLots.length) return null;

    let totalMv = 0, totalCost = 0;
    const holdings = readyLots.map((lot) => {
      const inst = INSTRUMENTS[lot.id];
      const cs = inst.candles;
      const entryPx = cs[Math.max(0, cs.length - 60)].close; // 60-bar historical entry price from REAL candles
      const fxNow = toBase(lot.ccy);
      const mvBase = lot.qty * inst.last.close * fxNow;
      const costBase = lot.qty * entryPx * fxNow;
      totalMv += mvBase;
      totalCost += costBase;
      return { ...lot, inst, entryPx, mvBase, costBase, pnlBase: mvBase - costBase, pnlPct: ((mvBase - costBase) / costBase) * 100 };
    });
    holdings.forEach((h) => { h.weight = (h.mvBase / totalMv) * 100; });

    const T = Math.min(...holdings.map((h) => h.inst.candles.length)) - 1;
    const retsByAsset = holdings.map((h) => {
      const cs = h.inst.candles.slice(-(T + 1));
      const arr = [];
      for (let i = 1; i < cs.length; i++) arr.push((cs[i].close - cs[i - 1].close) / cs[i - 1].close);
      return arr;
    });
    const portRets = [];
    for (let t = 0; t < T; t++) {
      let r = 0;
      for (let j = 0; j < holdings.length; j++) r += (holdings[j].weight / 100) * retsByAsset[j][t];
      portRets.push(r);
    }
    const mean = portRets.reduce((a, b) => a + b, 0) / T;
    const std = Math.sqrt(portRets.reduce((a, b) => a + (b - mean) ** 2, 0) / Math.max(1, T - 1));
    const sharpe = std > 0 ? ((mean - 0.042 / 252) / std) * Math.sqrt(252) : 0;
    let peak = 1, cum = 1, maxDd = 0;
    portRets.forEach((r) => { cum *= (1 + r); peak = Math.max(peak, cum); maxDd = Math.min(maxDd, (cum - peak) / peak); });
    const sorted = [...portRets].sort((a, b) => a - b);
    const var95Pct = -sorted[Math.floor(T * 0.05)] * 100;
    const var99Pct = -sorted[Math.floor(T * 0.01)] * 100;
    const beta = holdings.reduce((acc, h) => acc + (h.weight / 100) * h.inst.beta, 0);

    const corr = holdings.map((_, i) => holdings.map((__, j) => {
      if (i === j) return 1;
      const a = retsByAsset[i], b = retsByAsset[j];
      const ma = a.reduce((x, y) => x + y, 0) / T, mb = b.reduce((x, y) => x + y, 0) / T;
      let num = 0, da = 0, db = 0;
      for (let t = 0; t < T; t++) { const xa = a[t] - ma, xb = b[t] - mb; num += xa * xb; da += xa * xa; db += xb * xb; }
      return num / Math.sqrt(da * db || 1);
    }));
    return { totalMv, totalCost, unrealizedPnl: totalMv - totalCost, unrealizedPct: ((totalMv - totalCost) / totalCost) * 100, holdings, sharpe, maxDdPct: maxDd * 100, beta, var95Pct, var99Pct, corr };
  }

  function runBqlTemplate(templateKey) {
    const t0 = performance.now();
    const usdCny = FX.USD_CNY || 7.0;
    if (templateKey === 'cross_asset') {
      const rows = Object.values(INSTRUMENTS).filter((i) => i.candles.length >= 31).map((inst) => {
        const fx = inst.ccy === 'CNY' ? 1 / usdCny : 1.0;
        const c = inst.candles;
        const pNow = c[c.length - 1].close * fx;
        const p30 = c[c.length - 31].close * fx;
        const ret30 = ((pNow / p30) - 1) * 100;
        const rets = [];
        for (let i = c.length - 30; i < c.length; i++) rets.push((c[i].close - c[i - 1].close) / c[i - 1].close);
        const m = rets.reduce((a, b) => a + b, 0) / rets.length;
        const sd = Math.sqrt(rets.reduce((a, b) => a + (b - m) ** 2, 0) / (rets.length - 1));
        const annVol = sd * Math.sqrt(inst.market === 'CRYPTO' ? 365 : 252) * 100;
        return { symbol: inst.symbol, market: inst.market, last_usd: `$${pNow.toFixed(2)}`, ret_30d_usd: `${ret30 >= 0 ? '+' : ''}${ret30.toFixed(2)}%`, ann_vol: `${annVol.toFixed(1)}%`, as_of: inst.liveUpdatedAt || '—' };
      }).sort((a, b) => parseFloat(b.ret_30d_usd) - parseFloat(a.ret_30d_usd));
      return { cols: ['symbol', 'market', 'last_usd', 'ret_30d_usd', 'ann_vol', 'as_of'], rows, chart: null, ms: (performance.now() - t0).toFixed(2) };
    }
    if (templateKey === 'cn_micro') {
      const rows = Object.values(INSTRUMENTS).filter((i) => i.market === 'CN_ASHARE' && i.last).map((inst) => {
        const up = roundCny(inst.prevClose * (1 + inst.limitPct));
        const dn = roundCny(inst.prevClose * (1 - inst.limitPct));
        const chg = ((inst.last.close - inst.prevClose) / inst.prevClose) * 100;
        return { code: `${inst.symbol} ${inst.localName}`, board: inst.board, last_cny: `¥${inst.last.close.toFixed(2)}`, chg_pct: `${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%`, limit_up: `¥${up.toFixed(2)}`, limit_down: `¥${dn.toFixed(2)}`, date: inst.last.date };
      });
      return { cols: ['code', 'board', 'last_cny', 'chg_pct', 'limit_up', 'limit_down', 'date'], rows, chart: null, ms: (performance.now() - t0).toFixed(2) };
    }
    const c = INSTRUMENTS['CR:SPOT:BTC-USD'].candles;
    if (c.length < 35) return { cols: ['status'], rows: [{ status: 'Loading live BTC-USD candles...' }], chart: null, ms: '0' };
    let eq = 100, bm = 100, peak = 100, maxDd = 0, wins = 0, active = 0;
    const stratRets = [], curve = [];
    for (let i = 30; i < c.length; i++) {
      const sma10 = c.slice(i - 10, i).reduce((s, x) => s + x.close, 0) / 10;
      const sma30 = c.slice(i - 30, i).reduce((s, x) => s + x.close, 0) / 30;
      const sig = sma10 > sma30 ? 1 : 0;
      const r = (c[i].close - c[i - 1].close) / c[i - 1].close;
      const sr = sig * r;
      stratRets.push(sr);
      if (sig) { active++; if (sr > 0) wins++; }
      eq *= (1 + sr); bm *= (1 + r);
      peak = Math.max(peak, eq); maxDd = Math.min(maxDd, (eq - peak) / peak);
      curve.push({ date: c[i].date, strategy: eq, benchmark: bm });
    }
    const mean = stratRets.reduce((a, b) => a + b, 0) / stratRets.length;
    const sd = Math.sqrt(stratRets.reduce((a, b) => a + (b - mean) ** 2, 0) / (stratRets.length - 1));
    const sharpe = sd > 0 ? (mean / sd) * Math.sqrt(365) : 0;
    return {
      cols: ['strategy', 'bars', 'total_return', 'buy_and_hold', 'sharpe', 'max_drawdown', 'win_rate'],
      rows: [{ strategy: 'LIVE BTC-USD SMA(10)/SMA(30)', bars: curve.length, total_return: `${(eq - 100).toFixed(2)}%`, buy_and_hold: `${(bm - 100).toFixed(2)}%`, sharpe: sharpe.toFixed(2), max_drawdown: `${(maxDd * 100).toFixed(2)}%`, win_rate: `${active ? ((wins / active) * 100).toFixed(1) : '0.0'}%` }],
      chart: curve, ms: (performance.now() - t0).toFixed(2),
    };
  }

  function drawCandleChart(canvas, inst) {
    if (!canvas || !inst?.candles?.length) return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width < 40 || rect.height < 40) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(rect.width * dpr); canvas.height = Math.floor(rect.height * dpr);
    const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height, th = getTheme();
    ctx.fillStyle = th.bg; ctx.fillRect(0, 0, W, H);

    const bars = inst.candles.slice(-110);
    const padL = 8, padR = 64, padT = 14, padB = 22;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const minP = Math.min(...bars.map((b) => b.low)) * 0.992;
    const maxP = Math.max(...bars.map((b) => b.high)) * 1.008;
    const maxV = Math.max(...bars.map((b) => b.volume)) || 1;
    const yOf = (p) => padT + ((maxP - p) / (maxP - minP || 1)) * (plotH * 0.82);
    const stepX = plotW / bars.length;

    ctx.strokeStyle = th.border; ctx.lineWidth = 0.5; ctx.font = '11px ui-monospace, monospace'; ctx.fillStyle = th.muted;
    for (let g = 0; g <= 4; g++) {
      const p = minP + (g / 4) * (maxP - minP), y = yOf(p);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillText(p >= 1000 ? p.toFixed(0) : p.toFixed(2), W - padR + 4, y + 4);
    }

    if (state.gpOverlays.vp) {
      const bins = 16, hist = new Array(bins).fill(0);
      bars.forEach((b) => { hist[Math.min(bins - 1, Math.max(0, Math.floor(((b.close - minP) / (maxP - minP || 1)) * bins)))] += b.volume; });
      const maxH = Math.max(...hist) || 1, poc = hist.indexOf(maxH);
      for (let i = 0; i < bins; i++) {
        const y0 = yOf(minP + ((i + 1) / bins) * (maxP - minP)), y1 = yOf(minP + (i / bins) * (maxP - minP));
        const bw = (hist[i] / maxH) * (plotW * 0.16);
        ctx.fillStyle = i === poc ? th.warning : th.primary; ctx.globalAlpha = i === poc ? 0.35 : 0.14;
        ctx.fillRect(W - padR - bw, y0, bw, Math.max(1, y1 - y0 - 1));
      }
      ctx.globalAlpha = 1;
    }

    const volBaseY = padT + plotH;
    bars.forEach((b, i) => {
      const x = padL + i * stepX, vh = (b.volume / maxV) * (plotH * 0.16);
      ctx.fillStyle = b.close >= b.open ? th.success : th.error; ctx.globalAlpha = 0.28;
      ctx.fillRect(x + 1, volBaseY - vh, Math.max(1, stepX - 2), vh);
    });
    ctx.globalAlpha = 1;

    bars.forEach((b, i) => {
      const cx = padL + (i + 0.5) * stepX, isUp = b.close >= b.open;
      ctx.strokeStyle = isUp ? th.success : th.error; ctx.fillStyle = isUp ? th.success : th.error; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx, yOf(b.high)); ctx.lineTo(cx, yOf(b.low)); ctx.stroke();
      const top = yOf(Math.max(b.open, b.close)), bot = yOf(Math.min(b.open, b.close));
      ctx.fillRect(cx - Math.max(1.5, stepX * 0.32), top, Math.max(3, stepX * 0.64), Math.max(1.5, bot - top));
    });

    const drawMa = (period, color) => {
      ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath(); let s = false;
      for (let i = period - 1; i < bars.length; i++) {
        const avg = bars.slice(i - period + 1, i + 1).reduce((a, x) => a + x.close, 0) / period;
        const x = padL + (i + 0.5) * stepX, y = yOf(avg);
        if (!s) { ctx.moveTo(x, y); s = true; } else ctx.lineTo(x, y);
      }
      ctx.stroke();
    };
    if (state.gpOverlays.sma20) drawMa(20, th.warning);
    if (state.gpOverlays.sma50) drawMa(50, th.primary);

    ctx.fillStyle = th.muted; ctx.font = '11px ui-monospace, monospace';
    [0, Math.floor(bars.length / 2), bars.length - 1].forEach((idx) => {
      ctx.fillText(bars[idx].date.slice(5), Math.min(W - padR - 48, padL + idx * stepX), H - 5);
    });
  }

  function drawLineSeriesChart(canvas, seriesList) {
    if (!canvas || !seriesList.length) return;
    const rect = canvas.getBoundingClientRect();
    if (rect.width < 40 || rect.height < 40) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.floor(rect.width * dpr); canvas.height = Math.floor(rect.height * dpr);
    const ctx = canvas.getContext('2d'); ctx.scale(dpr, dpr);
    const W = rect.width, H = rect.height, th = getTheme();
    ctx.fillStyle = th.bg; ctx.fillRect(0, 0, W, H);
    const allVals = seriesList.flatMap((s) => s.values);
    const minV = Math.min(...allVals) * 0.98, maxV = Math.max(...allVals) * 1.02;
    const padL = 10, padR = 52, padT = 14, padB = 20;
    const yOf = (v) => padT + ((maxV - v) / (maxV - minV || 1)) * (H - padT - padB);
    ctx.strokeStyle = th.border; ctx.lineWidth = 0.5; ctx.font = '11px ui-monospace, monospace'; ctx.fillStyle = th.muted;
    for (let g = 0; g <= 3; g++) {
      const v = minV + (g / 3) * (maxV - minV), y = yOf(v);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
      ctx.fillText(v.toFixed(0), W - padR + 5, y + 4);
    }
    seriesList.forEach((s, idx) => {
      ctx.strokeStyle = s.color || th.charts[idx % th.charts.length]; ctx.lineWidth = 2; ctx.beginPath();
      const step = (W - padL - padR) / Math.max(1, s.values.length - 1);
      s.values.forEach((v, i) => { const x = padL + i * step, y = yOf(v); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
      ctx.stroke();
    });
  }

  function renderComp(pane) {
    const ccy = state.compBaseCcy, usdCny = FX.USD_CNY || 7.0;
    const toBase = (c) => c === ccy ? 1 : (c === 'CNY' && ccy === 'USD' ? 1 / usdCny : usdCny);
    const rows = pane.compIds.map((id) => {
      const inst = INSTRUMENTS[id];
      if (!inst?.last) return '';
      const fx = toBase(inst.ccy), c = inst.candles;
      const ret = c.length > 60 ? ((c[c.length - 1].close / c[c.length - 61].close) - 1) * 100 : 0;
      const mcap = inst.shares ? inst.last.close * inst.shares * fx : null;
      const fy = inst.fy[inst.fy.length - 1];
      const pe = (mcap && fy?.ni > 0) ? (mcap / (fy.ni * fx)).toFixed(1) + 'x' : '—';
      return `<tr><td class="mono font-semibold text-[var(--warning)]">${inst.symbol}</td><td>${inst.market}</td><td class="text-right mono">${fmtPx(inst.last.close * fx, ccy)}</td><td class="text-right mono">${fmtCompact(mcap, ccy)}</td><td class="text-right mono text-[var(--primary)]">${pe}</td><td class="text-right mono font-semibold ${ret >= 0 ? 'text-[var(--success)]' : 'text-[var(--error)]'}">${ret >= 0 ? '+' : ''}${ret.toFixed(1)}%</td></tr>`;
    }).join('');
    return `
      <div class="h-full flex flex-col overflow-hidden text-xs">
        <div class="px-3 py-1.5 bg-[var(--background)] border-b border-[var(--border)] flex items-center justify-between mono">
          <span>LIVE FX-NORMALIZED PEER COMPARISON (USD/CNY=${usdCny.toFixed(4)})</span>
          <div class="flex gap-1">${['USD', 'CNY'].map((c) => `<button data-comp-ccy="${c}" class="px-2 py-0.5 rounded border cursor-pointer ${ccy === c ? 'border-[var(--warning)] text-[var(--warning)] font-bold' : 'border-[var(--border)] text-[var(--muted-foreground)]'}">${c}</button>`).join('')}</div>
        </div>
        <div class="h-40 border-b border-[var(--border)]"><canvas id="comp-canvas-${pane.id}" class="w-full h-full"></canvas></div>
        <div class="flex-1 overflow-auto"><table class="term-table"><thead><tr><th class="text-left">Ticker</th><th class="text-left">Mkt</th><th class="text-right">Live Px (${ccy})</th><th class="text-right">Mkt Cap (${ccy})</th><th class="text-right">P/E</th><th class="text-right">60D Ret</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>`;
  }

  function renderOpt(inst) {
    const target = inst.market === 'US' ? inst : INSTRUMENTS['EQ:US:AAPL'];
    if (!target.last) return loadingBox(target);
    const spot = target.last.close, step = spot > 100 ? 5 : 2.5, atm = Math.round(spot / step) * step;
    const rows = [-3, -2, -1, 0, 1, 2, 3].map((k) => {
      const st = atm + k * step, m = (spot - st) / spot;
      const iv = (24 + Math.abs(m) * 45 + (target.symbol === 'NVDA' ? 14 : 0)).toFixed(1);
      const cDelta = Math.max(0.05, Math.min(0.95, 0.5 + m * 3.5)).toFixed(2);
      const pDelta = (-Math.max(0.05, Math.min(0.95, 0.5 - m * 3.5))).toFixed(2);
      const cMid = (Math.max(0, spot - st) + spot * (Number(iv) / 100) * 0.12 * Math.exp(-3 * m * m)).toFixed(2);
      const pMid = (Math.max(0, st - spot) + spot * (Number(iv) / 100) * 0.12 * Math.exp(-3 * m * m)).toFixed(2);
      return `<tr><td class="text-right mono text-[var(--warning)]">${iv}%</td><td class="text-right mono text-[var(--primary)]">${cDelta}</td><td class="text-right mono text-[var(--success)]">$${cMid}</td><td class="text-center mono font-bold text-[var(--warning)] bg-[var(--sidebar)]">$${st.toFixed(1)}</td><td class="text-left mono text-[var(--error)]">$${pMid}</td><td class="text-right mono text-[var(--primary)]">${pDelta}</td><td class="text-right mono text-[var(--warning)]">${iv}%</td></tr>`;
    }).join('');
    return `<div class="h-full overflow-y-auto p-3 space-y-3 text-xs"><div class="flex flex-wrap justify-between gap-2 pb-2 border-b border-[var(--border)] mono"><span class="font-bold text-[var(--primary)]">${target.symbol} OPTIONS CHAIN (LIVE SPOT ANCHORED) & 13F</span><span>Live Spot: <strong>${fmtPx(spot, 'USD')}</strong> · CIK ${target.cik || '—'}</span></div><div class="overflow-x-auto rounded border border-[var(--card-border)]"><table class="term-table"><thead><tr><th class="text-right">Call IV</th><th class="text-right">Delta</th><th class="text-right">Call Theo</th><th class="text-center">STRIKE</th><th class="text-left">Put Theo</th><th class="text-right">Delta</th><th class="text-right">Put IV</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }

  function renderFlow() {
    const cns = Object.values(INSTRUMENTS).filter((i) => i.market === 'CN_ASHARE' && i.last);
    if (!cns.length) return `<div class="p-4 mono text-xs text-[var(--muted-foreground)] animate-pulse">Fetching live China A-Share board quotes from EastMoney...</div>`;
    const rows = cns.map((i) => {
      const up = roundCny(i.prevClose * (1 + i.limitPct)), dn = roundCny(i.prevClose * (1 - i.limitPct));
      const chg = ((i.last.close - i.prevClose) / i.prevClose) * 100;
      return `<tr><td class="mono font-bold text-[var(--warning)]">${i.symbol} ${i.localName}</td><td class="mono">${i.board}</td><td class="text-right mono font-semibold">¥${i.last.close.toFixed(2)}</td><td class="text-right mono font-semibold ${chg >= 0 ? 'text-[var(--error)]' : 'text-[var(--success)]'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</td><td class="text-right mono text-[var(--error)]">¥${up.toFixed(2)}</td><td class="text-right mono text-[var(--success)]">¥${dn.toFixed(2)}</td><td class="text-right mono text-[var(--primary)]">${fmtCompact(i.last.turnover, 'CNY')}</td><td class="text-right mono text-[var(--muted-foreground)]">${i.last.date}</td></tr>`;
    }).join('');
    return `<div class="h-full overflow-y-auto p-3 space-y-3 text-xs"><div class="flex flex-wrap justify-between gap-2 pb-2 border-b border-[var(--border)] mono"><span class="font-bold text-[var(--error)]">LIVE CHINA A-SHARE 涨跌停 BOARD MONITOR (沪深/北交所)</span><span>T+1 STRICT · EastMoney Live</span></div><div class="overflow-x-auto rounded border border-[var(--card-border)]"><table class="term-table"><thead><tr><th class="text-left">Ticker</th><th class="text-left">Board</th><th class="text-right">Live Last</th><th class="text-right">Chg %</th><th class="text-right">涨停 Up</th><th class="text-right">跌停 Down</th><th class="text-right">Turnover</th><th class="text-right">Session</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }

  function renderPerp() {
    const crs = Object.values(INSTRUMENTS).filter((i) => i.market === 'CRYPTO' && i.last);
    if (!crs.length) return `<div class="p-4 mono text-xs text-[var(--muted-foreground)] animate-pulse">Fetching live OKX perpetual funding, Open Interest & DefiLlama TVL...</div>`;
    const rows = crs.map((i) => {
      const c = i.crypto;
      return `<tr><td class="mono font-bold text-[var(--warning)]">${i.symbol}</td><td class="text-right mono font-semibold">${fmtPx(i.last.close, 'USD')}</td><td class="text-right mono ${(c.funding8h ?? 0) >= 0 ? 'text-[var(--success)]' : 'text-[var(--error)]'}">${c.funding8h !== null ? (c.funding8h * 10000).toFixed(3) + ' bp' : '—'}</td><td class="text-right mono text-[var(--primary)]">${c.funding8h !== null ? (c.funding8h * 3 * 365 * 100).toFixed(2) + '%' : '—'}</td><td class="text-right mono">${fmtCompact(c.oiUsd, 'USD')}</td><td class="text-right mono">${fmtCompact(c.vol24hUsd || i.last.turnover, 'USD')}</td><td class="text-right mono text-[var(--success)]">${c.tvlUsd ? fmtCompact(c.tvlUsd, 'USD') : '—'}</td></tr>`;
    }).join('');
    return `<div class="h-full overflow-y-auto p-3 space-y-3 text-xs"><div class="flex flex-wrap justify-between gap-2 pb-2 border-b border-[var(--border)] mono"><span class="font-bold text-[var(--warning)]">LIVE CRYPTO PERPETUAL FUNDING, OPEN INTEREST & DEFILLAMA TVL</span><span class="text-[var(--success)]">Global DEX 24h: ${fmtCompact(DEFI_GLOBAL.dex24hUsd, 'USD')}</span></div><div class="overflow-x-auto rounded border border-[var(--card-border)]"><table class="term-table"><thead><tr><th class="text-left">Asset</th><th class="text-right">Live Spot</th><th class="text-right">OKX 8h Fund</th><th class="text-right">Ann Fund</th><th class="text-right">OKX Open Int</th><th class="text-right">24h Vol</th><th class="text-right">DefiLlama TVL</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }

  function renderNews() {
    const items = Object.values(INSTRUMENTS).filter((i) => i.last).map((i) => {
      const chg = ((i.last.close - i.prevClose) / i.prevClose) * 100;
      const lbl = chg > 1.2 ? 'BULLISH' : chg < -1.2 ? 'BEARISH' : 'NEUTRAL';
      return `<article class="p-2.5 border-b border-[var(--card-border)] space-y-1"><div class="flex justify-between mono text-xs"><span class="text-[var(--warning)]">${i.liveSource} · ${i.liveUpdatedAt}</span><span class="px-1.5 rounded border ${lbl === 'BULLISH' ? 'border-[var(--success)] text-[var(--success)]' : lbl === 'BEARISH' ? 'border-[var(--error)] text-[var(--error)]' : 'border-[var(--border)]'}">${lbl} (${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%)</span></div><div class="font-semibold">${i.symbol} ${i.name} ${i.localName || ''} trading at ${fmtPx(i.last.close, i.ccy)} (${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%)</div><div class="text-[var(--muted-foreground)]">Session H/L: ${fmtPx(i.last.high, i.ccy)} / ${fmtPx(i.last.low, i.ccy)} · Volume: ${fmtCompact(i.last.volume)}</div></article>`;
    }).join('');
    return `<div class="h-full overflow-y-auto text-xs">${items || '<div class="p-4 mono text-[var(--muted-foreground)]">Loading live market tape...</div>'}</div>`;
  }

  function renderPort() {
    const ccy = state.portBaseCcy;
    const p = computePortfolio(ccy);
    if (!p) return `<div class="p-4 mono text-xs text-[var(--muted-foreground)] animate-pulse">Waiting for live US, China A-Share, Crypto & FX feeds to value portfolio...</div>`;
    const rows = p.holdings.map((h) => `
      <tr>
        <td class="mono font-semibold text-[var(--warning)]">${h.inst.symbol}</td>
        <td class="mono">${h.inst.market} · ${h.ccy}</td>
        <td class="text-right mono">${h.qty} ${h.t1Locked ? `<span class="px-1 rounded border border-[var(--error)] text-[var(--error)]">T+1:${h.t1Locked}</span>` : ''}</td>
        <td class="text-right mono">${fmtPx(h.inst.last.close, h.ccy)}</td>
        <td class="text-right mono">${fmtCompact(h.mvBase, ccy)} (${h.weight.toFixed(1)}%)</td>
        <td class="text-right mono font-semibold ${h.pnlBase >= 0 ? 'text-[var(--success)]' : 'text-[var(--error)]'}">${h.pnlBase >= 0 ? '+' : ''}${fmtCompact(h.pnlBase, ccy)} (${h.pnlPct.toFixed(1)}%)</td>
      </tr>`).join('');
    const corrRows = p.holdings.map((h, i) => `<tr><td class="mono font-semibold">${h.inst.symbol}</td>${p.corr[i].map((v, j) => `<td class="text-center mono ${i === j ? 'text-[var(--muted-foreground)]' : v >= 0.55 ? 'text-[var(--error)] font-semibold' : v <= 0.15 ? 'text-[var(--success)]' : ''}">${v.toFixed(2)}</td>`).join('')}</tr>`).join('');
    return `
      <div class="h-full overflow-y-auto p-3 space-y-3 text-xs">
        <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-[var(--border)]">
          <span class="font-semibold text-sm">Live Multi-Asset Portfolio (Marked to Real Market Prices)</span>
          <div class="flex gap-1 mono">${['USD', 'CNY', 'USDT'].map((c) => `<button data-port-ccy="${c}" class="px-2 py-0.5 rounded border cursor-pointer ${ccy === c ? 'border-[var(--warning)] text-[var(--warning)] font-bold' : 'border-[var(--border)] text-[var(--muted-foreground)]'}">${c}</button>`).join('')}</div>
        </div>
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2 mono">
          <div class="p-2 rounded bg-[var(--background)] border border-[var(--card-border)]"><div class="text-[var(--muted-foreground)]">NAV (${ccy})</div><div class="font-bold">${fmtCompact(p.totalMv, ccy)}</div></div>
          <div class="p-2 rounded bg-[var(--background)] border border-[var(--card-border)]"><div class="text-[var(--muted-foreground)]">60D P&L</div><div class="font-bold ${p.unrealizedPnl >= 0 ? 'text-[var(--success)]' : 'text-[var(--error)]'}">${p.unrealizedPnl >= 0 ? '+' : ''}${fmtCompact(p.unrealizedPnl, ccy)}</div></div>
          <div class="p-2 rounded bg-[var(--background)] border border-[var(--card-border)]"><div class="text-[var(--muted-foreground)]">SHARPE</div><div class="font-bold text-[var(--primary)]">${p.sharpe.toFixed(2)}</div></div>
          <div class="p-2 rounded bg-[var(--background)] border border-[var(--card-border)]"><div class="text-[var(--muted-foreground)]">MAX DD</div><div class="font-bold text-[var(--error)]">${p.maxDdPct.toFixed(1)}%</div></div>
          <div class="p-2 rounded bg-[var(--background)] border border-[var(--card-border)]"><div class="text-[var(--muted-foreground)]">BETA</div><div class="font-bold text-[var(--warning)]">${p.beta.toFixed(2)}</div></div>
          <div class="p-2 rounded bg-[var(--background)] border border-[var(--card-border)]"><div class="text-[var(--muted-foreground)]">1D VaR 95%</div><div class="font-bold text-[var(--error)]">-${p.var95Pct.toFixed(2)}%</div></div>
        </div>
        <div class="overflow-x-auto rounded border border-[var(--card-border)]"><table class="term-table"><thead><tr><th class="text-left">Asset</th><th class="text-left">Mkt/CCY</th><th class="text-right">Qty</th><th class="text-right">Live Px</th><th class="text-right">Value (${ccy})</th><th class="text-right">60D P&L</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="overflow-x-auto rounded border border-[var(--card-border)] p-2 bg-[var(--background)]"><div class="mono text-[var(--warning)] mb-1">REALIZED CORRELATION MATRIX (COMPUTED FROM LIVE HISTORICAL RETURNS)</div><table class="term-table"><thead><tr><th class="text-left">Asset</th>${p.holdings.map((h) => `<th class="text-center">${h.inst.symbol}</th>`).join('')}</tr></thead><tbody>${corrRows}</tbody></table></div>
      </div>`;
  }

  function renderBql(pane) {
    state.bqlResult = runBqlTemplate(state.bqlQuery);
    const res = state.bqlResult;
    const templates = [
      ['cross_asset', '[SQL] Live Cross-Asset 30D USD Return & Volatility'],
      ['cn_micro', '[SQL] Live China A-Share 涨跌停 Board Scanner'],
      ['backtest', '[PYTHON] Live BTC-USD SMA(10)/SMA(30) Backtest'],

    return `
      <div class="h-full flex flex-col overflow-hidden text-xs">
        <div class="px-3 py-1.5 bg-[var(--background)] border-b border-[var(--border)] flex flex-wrap items-center justify-between gap-2 mono">
          <select data-bql-select="1" class="bg-[var(--card)] border border-[var(--border)] rounded px-2 py-1 text-xs text-[var(--primary)]">${templates.map(([k, lbl]) => `<option value="${k}" ${state.bqlQuery === k ? 'selected' : ''}>${lbl}</option>`).join('')}</select>
          <div class="flex items-center gap-2"><span class="text-[var(--success)]">${res.rows.length} rows (${res.ms} ms)</span><button data-bql-run="1" class="px-2.5 py-1 rounded bg-[var(--warning)] text-black font-bold cursor-pointer">RUN BQL</button></div>
        </div>
        ${res.chart ? `<div class="h-40 border-b border-[var(--border)]"><canvas id="bql-canvas-${pane.id}" class="w-full h-full"></canvas></div>` : ''}
        <div class="overflow-x-auto flex-1"><table class="term-table mono"><thead><tr>${res.cols.map((c) => `<th class="text-left">${c}</th>`).join('')}</tr></thead><tbody>${res.rows.map((r) => `<tr>${res.cols.map((c) => `<td>${r[c]}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      </div>`;
  }

  function renderStatusBar() {
    const tapeIds = ['CR:SPOT:BTC-USD', 'CR:SPOT:ETH-USD', 'CR:SPOT:SOL-USD', 'EQ:US:AAPL', 'EQ:US:NVDA', 'EQ:SSE:600519', 'EQ:SZSE:300750'];
    const tapeHtml = tapeIds.map((id) => {
      const inst = INSTRUMENTS[id];
      if (!inst?.last) return `<span class="mono px-1.5 text-[var(--muted-foreground)]">${inst.symbol} …</span>`;
      const chgPct = ((inst.last.close - inst.prevClose) / inst.prevClose) * 100;
      return `<button data-tape-id="${id}" class="mono px-1.5 py-0.5 rounded hover:bg-[var(--card)] cursor-pointer"><span class="font-semibold">${inst.symbol}</span> ${fmtPx(inst.last.close, inst.ccy)} <span class="${chgPct >= 0 ? 'text-[var(--success)]' : 'text-[var(--error)]'}">${chgPct >= 0 ? '+' : ''}${chgPct.toFixed(2)}%</span></button>`;
    }).join('');
    document.getElementById('status-bar').innerHTML = `
      <div class="flex flex-wrap items-center gap-3 mono">
        <span class="font-bold text-[var(--warning)]">OPENTERM</span>
        <span>USD/CNY <strong class="text-[var(--primary)]">${FX.USD_CNY ? FX.USD_CNY.toFixed(4) : '…'}</strong></span>
        <span class="text-[var(--success)]">● ${wsStatus}</span>
      </div>
      <div class="flex flex-wrap items-center gap-1.5">${tapeHtml}</div>`;
  }

  function renderWorkspace() {
    renderStatusBar();
    const activePane = state.panes.find((p) => p.id === state.activePaneId) || state.panes[0];
    document.getElementById('active-pane-badge').textContent = `P${activePane.idx}`;
    document.getElementById('layout-controls').innerHTML = ['1x1', '1x2', '2x2'].map((l) => `<button data-layout="${l}" class="px-2 py-1 rounded cursor-pointer ${state.layout === l ? 'bg-[var(--warning)] text-black font-bold' : 'text-[var(--muted-foreground)]'}">${l}</button>`).join('');

    const grid = document.getElementById('workspace-grid');
    grid.className = `flex-1 grid gap-2 p-2 ${state.layout === '1x1' ? 'grid-cols-1' : 'grid-cols-1 lg:grid-cols-2'}`;
    const visiblePanes = state.layout === '1x1' ? [activePane] : state.layout === '1x2' ? state.panes.slice(0, 2) : state.panes;

    grid.innerHTML = visiblePanes.map((pane) => {
      const inst = INSTRUMENTS[pane.instId] || INSTRUMENTS['CR:SPOT:BTC-USD'];
      const isActive = pane.id === state.activePaneId;
      const linkColor = pane.linkGroup === 'A' ? 'var(--primary)' : pane.linkGroup === 'B' ? 'var(--warning)' : pane.linkGroup === 'C' ? 'var(--success)' : 'var(--muted-foreground)';
      const fnTabs = FUNCTIONS.map((f) => `<button data-pane-fn="${pane.id}:${f}" class="px-1.5 py-0.5 rounded mono text-xs cursor-pointer ${pane.fn === f ? 'bg-[var(--warning)] text-black font-bold' : 'text-[var(--muted-foreground)] hover:text-[var(--foreground)]'}">${f}</button>`).join('');

      let content = '';
      if (pane.fn === 'DES') content = renderDes(inst);
      else if (pane.fn === 'FA') content = renderFa(inst);
      else if (pane.fn === 'GP') content = renderGp(pane, inst);
      else if (pane.fn === 'COMP') content = renderComp(pane);
      else if (pane.fn === 'OPT') content = renderOpt(inst);
      else if (pane.fn === 'FLOW') content = renderFlow();
      else if (pane.fn === 'PERP') content = renderPerp();
      else if (pane.fn === 'NEWS') content = renderNews();
      else if (pane.fn === 'PORT') content = renderPort();
      else if (pane.fn === 'BQL') content = renderBql(pane);

      return `
        <section data-pane-box="${pane.id}" class="bg-[var(--card)] border border-[var(--border)] rounded flex flex-col min-h-[380px] overflow-hidden ${isActive ? 'pane-active' : ''}">
          <div class="px-2 py-1.5 bg-[var(--sidebar)] border-b border-[var(--border)] flex flex-wrap items-center justify-between gap-1.5">
            <div class="flex items-center gap-1.5 mono text-xs">
              <span class="px-1.5 py-0.5 rounded font-bold ${isActive ? 'bg-[var(--warning)] text-black' : 'bg-[var(--background)] text-[var(--muted-foreground)]'}">P${pane.idx}</span>
              <button data-cycle-link="${pane.id}" style="border-color:${linkColor};color:${linkColor}" class="px-1.5 py-0.5 rounded border font-semibold cursor-pointer">GRP ${pane.linkGroup}</button>
              <span class="font-bold text-[var(--warning)]">${inst.symbol}</span>
            </div>
            <div class="flex flex-wrap items-center gap-0.5">${fnTabs}</div>
          </div>
          <div class="flex-1 min-h-0 overflow-hidden">${content}</div>
        </section>`;
    }).join('');

    requestAnimationFrame(() => drawAllCanvases(visiblePanes));
  }

  function drawAllCanvases(visiblePanes) {
    const panes = visiblePanes || state.panes;
    const th = getTheme();
    panes.forEach((pane) => {
      if (pane.fn === 'GP') drawCandleChart(document.getElementById(`gp-canvas-${pane.id}`), INSTRUMENTS[pane.instId]);
      else if (pane.fn === 'COMP') {
        const series = pane.compIds.filter((id) => INSTRUMENTS[id]?.candles?.length >= 30).map((id, idx) => {
          const cs = INSTRUMENTS[id].candles.slice(-60), base = cs[0].close;
          return { values: cs.map((c) => (c.close / base) * 100), color: th.charts[idx % th.charts.length] };
        });
        drawLineSeriesChart(document.getElementById(`comp-canvas-${pane.id}`), series);
      } else if (pane.fn === 'BQL' && state.bqlResult?.chart) {
        const ch = state.bqlResult.chart;
        drawLineSeriesChart(document.getElementById(`bql-canvas-${pane.id}`), [
          { values: ch.map((x) => x.strategy), color: th.success },
          { values: ch.map((x) => x.benchmark), color: th.muted },
        ]);
      }
    });
  }

  document.getElementById('quick-cmds').innerHTML = [
    ['BTC DES', 'BTC-USD <Crypto> DES'],
    ['600519 DES', '600519 CH <Equity> DES'],
    ['AAPL FA', 'AAPL US <Equity> FA'],
    ['FLOW', 'FLOW'],
    ['PERP', 'PERP'],
    ['OPT', 'AAPL US OPT'],
    ['PORT', 'PORT'],
    ['BQL', 'BQL'],
  ].map(([lbl, cmd]) => `<button data-run-cmd="${cmd}" class="px-2 py-1 rounded bg-[var(--background)] hover:border-[var(--warning)] border border-[var(--border)] mono text-xs cursor-pointer">${lbl}</button>`).join('');

  document.getElementById('btn-refresh-all').addEventListener('click', () => void refreshAllLiveMarketData());

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    const paneBox = e.target.closest('[data-pane-box]');
    if (paneBox && paneBox.dataset.paneBox !== state.activePaneId && !btn?.dataset.cycleLink) {
      state.activePaneId = paneBox.dataset.paneBox; renderWorkspace();
    }
    if (!btn) return;
    if (btn.dataset.runCmd) { void executeCommand(btn.dataset.runCmd); return; }
    if (btn.dataset.layout) { state.layout = btn.dataset.layout; renderWorkspace(); return; }
    if (btn.dataset.tapeId) {
      const p = state.panes.find((x) => x.id === state.activePaneId) || state.panes[0];
      p.instId = btn.dataset.tapeId;
      if (p.linkGroup !== 'NONE') state.panes.forEach((x) => { if (x.linkGroup === p.linkGroup) x.instId = btn.dataset.tapeId; });
      renderWorkspace(); return;
    }
    if (btn.dataset.paneFn) { const [pid, fn] = btn.dataset.paneFn.split(':'); state.activePaneId = pid; const p = state.panes.find((x) => x.id === pid); if (p) p.fn = fn; renderWorkspace(); return; }
    if (btn.dataset.cycleLink) { const p = state.panes.find((x) => x.id === btn.dataset.cycleLink); if (p) p.linkGroup = LINK_CYCLE[(LINK_CYCLE.indexOf(p.linkGroup) + 1) % LINK_CYCLE.length]; renderWorkspace(); return; }
    if (btn.dataset.faTab) { state.faTab = btn.dataset.faTab; renderWorkspace(); return; }
    if (btn.dataset.gpOv) { state.gpOverlays[btn.dataset.gpOv] = !state.gpOverlays[btn.dataset.gpOv]; renderWorkspace(); return; }
    if (btn.dataset.compCcy) { state.compBaseCcy = btn.dataset.compCcy; renderWorkspace(); return; }
    if (btn.dataset.portCcy) { state.portBaseCcy = btn.dataset.portCcy; renderWorkspace(); return; }
    if (btn.dataset.bqlRun) { state.bqlResult = runBqlTemplate(state.bqlQuery); renderWorkspace(); return; }
  });

  document.addEventListener('input', (e) => { if (e.target.dataset.dcf) { state.dcfParams[e.target.dataset.dcf] = parseFloat(e.target.value); renderWorkspace(); } });
  document.addEventListener('change', (e) => { if (e.target.dataset.bqlSelect) { state.bqlQuery = e.target.value; renderWorkspace(); } });

  const cmdInput = document.getElementById('cmd-input');
  const dropdown = document.getElementById('cmd-dropdown');
  let acItems = [];
  let acSelected = 0;
  let acDebounce = null;
  let acSeq = 0;

  function renderAcList(loadingText = '') {
    if (!acItems.length && !loadingText) { dropdown.classList.add('hidden'); return; }
    const header = `<div class="px-3 py-1 bg-[var(--sidebar)] border-b border-[var(--border)] flex justify-between mono text-xs text-[var(--muted-foreground)]"><span>${loadingText || 'GLOBAL LIVE SEARCH (US · CHINA A-SHARES · HK · 500+ CRYPTO)'}</span><span>↑↓ Select · Enter Run</span></div>`;
    const rows = acItems.map((x, idx) => `
      <button type="button" data-ac-idx="${idx}" class="w-full text-left px-3 py-1.5 flex items-center justify-between gap-2 text-xs cursor-pointer border-b border-[var(--card-border)] ${idx === acSelected ? 'bg-[var(--sidebar)]' : 'hover:bg-[var(--sidebar)]'}">
        <div class="flex items-center gap-2 min-w-0">
          <span class="mono px-1.5 py-0.5 rounded bg-[var(--background)] border border-[var(--border)] text-[var(--primary)] shrink-0">${x.badge || 'CMD'}</span>
          <span class="mono font-semibold text-[var(--warning)] shrink-0">${x.cmd}</span>
          <span class="text-[var(--muted-foreground)] truncate">${x.detail}</span>
        </div>
      </button>`).join('');
    dropdown.innerHTML = header + rows;
    dropdown.classList.remove('hidden');
  }

  async function selectAcItem(item) {
    cmdInput.value = '';
    dropdown.classList.add('hidden');
    if (item.searchHit) {
      const inst = registerDynamicSearchHit(item.searchHit);
      const pane = state.panes.find((p) => p.id === state.activePaneId) || state.panes[0];
      pane.instId = inst.id;
      if (pane.fn === 'PORT' || pane.fn === 'BQL' || pane.fn === 'FLOW') pane.fn = 'DES';
      if (pane.linkGroup !== 'NONE') state.panes.forEach((p) => { if (p.linkGroup === pane.linkGroup) p.instId = inst.id; });
      renderWorkspace(); // show loading immediately
      if (!inst.candles.length) {
        if (inst.market === 'CRYPTO') await fetchCryptoInstrument(inst);
        else await fetchEastMoneyInstrument(inst);
        renderWorkspace();
      }
      return;
    }
    await executeCommand(item.cmd);
  }

  function updateDropdown() {
    const raw = cmdInput.value.trim();
    const qUp = raw.toUpperCase();
    const localItems = [
      ...Object.values(INSTRUMENTS).map((i) => ({
        badge: i.market === 'CN_ASHARE' ? 'CN' : i.market,
        cmd: i.market === 'US' ? `${i.symbol} US <Equity> DES` : i.market === 'CN_ASHARE' ? `${i.symbol} CH <Equity> DES` : i.market === 'HK' ? `${i.symbol} HK <Equity> DES` : `${i.symbol} <Crypto> GP`,
        detail: `${i.name} ${i.localName || ''}`,
      })),
      { badge: 'FUNC', cmd: 'FLOW', detail: 'Live China A-Share 涨跌停 Board Monitor' },
      { badge: 'FUNC', cmd: 'PERP', detail: 'Live OKX Funding, OI & DefiLlama TVL' },
      { badge: 'FUNC', cmd: 'PORT', detail: 'Multi-Currency Portfolio & VaR Risk Matrix' },
      { badge: 'FUNC', cmd: 'BQL', detail: 'Live SQL & Python Backtest Console' },
    ].filter((x) => !qUp || x.cmd.toUpperCase().includes(qUp) || x.detail.toUpperCase().includes(qUp)).slice(0, 6);

    acItems = localItems;
    acSelected = 0;

    // For any non-empty query, fire debounced live global search across EastMoney + OKX + CoinGecko!
    if (raw.length >= 1 && !FUNCTIONS.includes(qUp) && !raw.includes(',')) {
      const searchTerm = raw.replace(/<EQUITY>|<CRYPTO>|<FX>/gi, '').split(/\s+/)[0];
      renderAcList(`Searching all global markets for "${searchTerm}"...`);
      clearTimeout(acDebounce);
      const mySeq = ++acSeq;
      acDebounce = setTimeout(async () => {
        const remoteHits = await searchGlobalSecurities(searchTerm);
        if (mySeq !== acSeq) return;
        const merged = [];
        const seenCmd = new Set();
        remoteHits.forEach((hit) => {
          const item = { badge: hit.badge, cmd: hit.cmd, detail: hit.name, searchHit: hit };
          seenCmd.add(hit.cmd);
          merged.push(item);
        });
        localItems.forEach((li) => { if (!seenCmd.has(li.cmd)) merged.push(li); });
        acItems = merged.slice(0, 10);
        acSelected = 0;
        renderAcList(acItems.length ? '' : `No global matches for "${searchTerm}"`);
      }, 180);
    } else {
      clearTimeout(acDebounce);
      renderAcList();
    }
  }

  dropdown.addEventListener('mousedown', (e) => {
    const b = e.target.closest('button');
    if (b?.dataset.acIdx !== undefined) {
      e.preventDefault();
      const item = acItems[Number(b.dataset.acIdx)];
      if (item) void selectAcItem(item);
    }
  });
  cmdInput.addEventListener('focus', updateDropdown);
  cmdInput.addEventListener('input', updateDropdown);
  cmdInput.addEventListener('blur', () => setTimeout(() => dropdown.classList.add('hidden'), 180));
  cmdInput.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' && acItems.length) {
      e.preventDefault(); acSelected = (acSelected + 1) % acItems.length; renderAcList();
    } else if (e.key === 'ArrowUp' && acItems.length) {
      e.preventDefault(); acSelected = (acSelected - 1 + acItems.length) % acItems.length; renderAcList();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const raw = cmdInput.value.trim();
      // If user typed a plain search word (like "Tesla" or "比亚迪") and dropdown has a highlighted match, select it directly!
      if (raw && acItems[acSelected] && !raw.includes(',') && !FUNCTIONS.includes(raw.toUpperCase()) && !raw.includes(' ')) {
        void selectAcItem(acItems[acSelected]);
      } else {
        cmdInput.value = ''; dropdown.classList.add('hidden'); void executeCommand(raw);
      }
    } else if (e.key === 'Escape') {
      cmdInput.value = ''; dropdown.classList.add('hidden'); cmdInput.blur();
    } else if (e.key === 'F2') {
      e.preventDefault(); cmdInput.value = `${cmdInput.value.trim()} <Equity> `;
    } else if (e.key === 'F3') {
      e.preventDefault(); cmdInput.value = `${cmdInput.value.trim()} <Crypto> `;
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== cmdInput && e.target.tagName !== 'INPUT') { e.preventDefault(); cmdInput.focus(); updateDropdown(); }
    else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); cmdInput.focus(); cmdInput.select(); updateDropdown(); }
    else if (e.altKey && ['1', '2', '3', '4'].includes(e.key)) { e.preventDefault(); state.activePaneId = `pane-${e.key}`; renderWorkspace(); }
    else if (e.altKey && e.key.toLowerCase() === 'l') { e.preventDefault(); const p = state.panes.find((x) => x.id === state.activePaneId); if (p) { p.linkGroup = LINK_CYCLE[(LINK_CYCLE.indexOf(p.linkGroup) + 1) % LINK_CYCLE.length]; renderWorkspace(); } }
  });
  window.addEventListener('resize', () => drawAllCanvases());

  // Boot: Render immediately, fetch 100% REAL LIVE market data & connect Coinbase live WebSocket!
  renderWorkspace();
  void refreshAllLiveMarketData();
  startLiveCryptoWebSocket();
  setInterval(() => void refreshAllLiveMarketData(), 60000);
})();
</script>
</body>
</html>
